-|\n| Picture or other likeness | −2 |\n| Garment or other possession | −4 |\n| Body part, lock of hair, or bit of nail | −10 |\n\nOn a successful save, the target isn't affected, and you can't use this spell on it again for 24 hours.\n\nOn a failed save, the spell creates an Invisible, intangible sensor within 10 feet of the target. You can see and hear through the sensor as if you were there. The sensor moves with the target, remaining within 10 feet of it for the duration. If something can see the sensor, it appears as a luminous orb about the size of your fist.\n\nInstead of targeting a creature, you can target a location you have seen. When you do so, the sensor appears at that location and doesn't move.","","a focus worth 1,000+ GP, such as a crystal ball, mirror, or water-filled font"],"searingsmite":["Searing Smite","Evocation",1,"As you hit the target, it takes an extra 1d6 Fire damage from the attack. At the start of each of its turns until the spell ends, the target takes 1d6 Fire damage and then makes a Constitution saving throw. On a failed save, the spell continues. On a successful save, the spell ends.","All the damage increases by 1d6 for each spell slot level above 1.",""],"secretchest":["Secret Chest","Conjuration",4,"You hide a chest and all its contents on the Ethereal Plane. You must touch the chest and the miniature replica that serve as Material components for the spell. The chest can contain up to 12 cubic feet of nonliving material (3 feet by 2 feet by 2 feet). While the chest remains on the Ethereal Plane, you can take a Magic action and touch the replica to recall the chest. It appears in an unoccupied space on the ground within 5 feet of you. You can send the chest back to the Ethereal Plane by taking a Magic action to touch the chest and the replica. After 60 days, there is a cumulative 5 percent chance at the end of each day that the spell ends. The spell also ends if you cast this spell again or if the Tiny replica chest is destroyed. If the spell ends and the larger chest is on the Ethereal Plane, the chest remains there for you or someone else to find.","","a chest, 3 feet by 2 feet by 2 feet, constructed from rare materials worth 5,000+ GP, and a Tiny replica of the chest made from the same materials worth 50+ GP"],"seeinvisibility":["See Invisibility","Divination",2,"For the duration, you see creatures and objects that have the Invisible condition as if they were visible, and you can see into the Ethereal Plane. Creatures and objects there appear ghostly.","","a pinch of talc"],"seeming":["Seeming","Illusion",5,"You give an illusory appearance to each creature of your choice that you can see within range. An unwilling target can make a Charisma saving throw, and if it succeeds, it is unaffected by this spell. You can give the same appearance or different ones to the targets. The spell can change the appearance of the targets' bodies and equipment. You can make each creature seem 1 foot shorter or taller and appear heavier or lighter. A target's new appearance must have the same basic arrangement of limbs as the target, but the extent of the illusion is otherwise up to you. The spell lasts for the duration. The changes wrought by this spell fail to hold up to physical inspection. For example, if you use this spell to add a hat to a creature's outfit, objects pass through the hat. A creature that takes the Study action to examine a target can make an Intelligence (Investigation) check against your spell save DC. If it succeeds, it becomes aware that the target is disguised.","",""],"sending":["Sending","Divination",3,"You send a short message of 25 words or fewer to a creature you have met or a creature described to you by someone who has met it. The target hears the message in its mind, recognizes you as the sender if it knows you, and can answer in a like manner immediately. The spell enables targets to understand the meaning of your message. You can send the message across any distance and even to other planes of existence, but if the target is on a different plane than you, there is a 5 percent chance that the message doesn't arrive. You know if the delivery fails. Upon receiving your message, a creature can block your ability to reach it again with this spell for 8 hours. If you try to send another message during that time, you learn that you are blocked, and the spell fails.","","a copper wire"],"sequester":["Sequester","Transmutation",7,"With a touch, you magically sequester an object or a willing creature. For the duration, the target has the Invisible condition and can't be targeted by Divination spells, detected by magic, or viewed remotely with magic. If the target is a creature, it enters a state of suspended animation; it has the Unconscious condition, doesn't age, and doesn't need food, water, or air. You can set a condition for the spell to end early. The condition can be anything you choose, but it must occur or be visible within 1 mile of the target. Examples include \"after 1,000 years\" or \"when the tarrasque awakens.\" This spell also ends if the target takes any damage.","","gem dust worth 5,000+ GP, which the spell consumes"],"shapechange":["Shapechange","Transmutation",9,"You shape-shift into another creature for the duration or until you take a Magic action to shape-shift into a different eligible form. The new form must be of a creature that has a Challenge Rating no higher than your level or Challenge Rating. You must have seen the sort of creature before, and it can't be a Construct or an Undead. When you cast the spell, you gain a number of Temporary Hit Points equal to the Hit Points of the first form into which you shape-shift. These Temporary Hit Points vanish if any remain when the spell ends. Your game statistics are replaced by the stat block of the chosen form, but you retain your creature type; alignment; personality; Intelligence, Wisdom, and Charisma scores; Hit Points; Hit Point Dice; proficiencies; and ability to communicate. If you have the Spellcasting feature, you retain it too. Upon shape-shifting, you determine whether your equipment drops to the ground or changes in size and shape to fit the new form while you're in it.","","a jade circlet worth 1,500+ GP"],"shatter":["Shatter","Evocation",2,"A loud noise erupts from a point of your choice within range. Each creature in a 10-foot-radius Sphere centered there makes a Constitution saving throw, taking 3d8 Thunder damage on a failed save or half as much damage on a successful one. A Construct has Disadvantage on the save. A nonmagical object that isn't being worn or carried also takes the damage if it's in the spell's area.","The damage increases by 1d8 for each spell slot level above 2.","a chip of mica"],"shield":["Shield","Abjuration",1,"An imperceptible barrier of magical force protects you. Until the start of your next turn, you have a +5 bonus to AC, including against the triggering attack, and you take no damage from Magic Missile.","",""],"shieldoffaith":["Shield of Faith","Abjuration",1,"A shimmering field surrounds a creature of your choice within range, granting it a +2 bonus to AC for the duration.","","a prayer scroll"],"shillelagh":["Shillelagh","Transmutation",0,"A Club or Quarterstaff you are holding is imbued with nature's power. For the duration, you can use your spellcasting ability instead of Strength for the attack and damage rolls of melee attacks using that weapon, and the weapon's damage die becomes a d8. If the attack deals damage, it can be Force damage or the weapon's normal damage type (your choice). The spell ends early if you cast it again or if you let go of the weapon.","The damage die changes when you reach levels 5 (d10), 11 (d12), and 17 (2d6).","mistletoe"],"shiningsmite":["Shining Smite","Transmutation",2,"The target hit by the strike takes an extra 2d6 Radiant damage from the attack. Until the spell ends, the target sheds Bright Light in a 5-foot radius, attack rolls against it have Advantage, and it can't benefit from the Invisible condition.","The damage increases by 1d6 for each spell slot level above 2.",""],"shockinggrasp":["Shocking Grasp","Evocation",0,"Lightning springs from you to a creature that you try to touch. Make a melee spell attack against the target. On a hit, the target takes 1d8 Lightning damage, and it can't make Opportunity Attacks until the start of its next turn.","The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).",""],"silence":["Silence","Illusion",2,"For the duration, no sound can be created within or pass through a 20-foot-radius Sphere centered on a point you choose within range. Any creature or object entirely inside the Sphere has Immunity to Thunder damage, and creatures have the Deafened condition while entirely inside it. Casting a spell that includes a Verbal component is impossible there.","",""],"silentimage":["Silent Image","Illusion",1,"You create the image of an object, a creature, or some other visible phenomenon that is no larger than a 15-foot Cube. The image appears at a spot within range and lasts for the duration. The image is purely visual; it isn't accompanied by sound, smell, or other sensory effects. As a Magic action, you can cause the image to move to any spot within range. As the image changes location, you can alter its appearance so that its movements appear natural for the image. For example, if you create an image of a creature and move it, you can alter the image so that it appears to be walking. Physical interaction with the image reveals it to be an illusion, since things can pass through it. A creature that takes a Study action to examine the image can determine that it is an illusion with a successful Intelligence (Investigation) check against your spell save DC. If a creature discerns the illusion for what it is, the creature can see through the image.","","a bit of fleece"],"simulacrum":["Simulacrum","Illusion",7,"You create a simulacrum of one Beast or Humanoid that is within 10 feet of you for the entire casting of the spell. You finish the casting by touching both the creature and a pile of ice or snow that is the same size as that creature, and the pile turns into the simulacrum, which is a creature. It uses the game statistics of the original creature at the time of casting, except it is a Construct, its Hit Point maximum is half as much, and it can't cast this spell. The simulacrum is Friendly to you and creatures you designate. It obeys your commands and acts on your turn in combat. The simulacrum can't gain levels, and it can't take Short or Long Rests. If the simulacrum takes damage, the only way to restore its Hit Points is to repair it as you take a Long Rest, during which you expend components worth 100 GP per Hit Point restored. The simulacrum must stay within 5 feet of you for the repair. The simulacrum lasts until it drops to 0 Hit Points, at which point it reverts to snow and melts away. If you cast this spell again, any simulacrum you created with this spell is instantly destroyed.","","powdered ruby worth 1,500+ GP, which the spell consumes"],"sleep":["Sleep","Enchantment",1,"Each creature of your choice in a 5-foot-radius Sphere centered on a point within range must succeed on a Wisdom saving throw or have the Incapacitated condition until the end of its next turn, at which point it must repeat the save. If the target fails the second save, the target has the Unconscious condition for the duration. The spell ends on a target if it takes damage or someone within 5 feet of it takes an action to shake it out of the spell's effect. Creatures that don't sleep, such as elves, or that have Immunity to the Exhaustion condition automatically succeed on saves against this spell.","","a pinch of sand or rose petals"],"sleetstorm":["Sleet Storm","Conjuration",3,"Until the spell ends, sleet falls in a 40-foot-tall, 20-foot-radius Cylinder centered on a point you choose within range. The area is Heavily Obscured, and exposed flames in the area are doused. Ground in the Cylinder is Difficult Terrain. When a creature enters the Cylinder for the first time on a turn or starts its turn there, it must succeed on a Dexterity saving throw or have the Prone condition and lose Concentration.","","a miniature umbrella"],"slow":["Slow","Transmutation",3,"You alter time around up to six creatures of your choice in a 40-foot Cube within range. Each target must succeed on a Wisdom saving throw or be affected by this spell for the duration. An affected target's Speed is halved, it takes a −2 penalty to AC and Dexterity saving throws, and it can't take Reactions. On its turns, it can take either an action or a Bonus Action, not both, and it can make only one attack if it takes the Attack action. If it casts a spell with a Somatic component, there is a 25 percent chance the spell fails as a result of the target making the spell's gestures too slowly. An affected target repeats the save at the end of each of its turns, ending the spell on itself on a success.","","a drop of molasses"],"sorcerousburst":["Sorcerous Burst","Evocation",0,"You cast sorcerous energy at one creature or object within range. Make a ranged spell attack against the target. On a hit, the target takes 1d8 damage of a type you choose: Acid, Cold, Fire, Lightning, Poison, Psychic, or Thunder. If you roll an 8 on a d8 for this spell, you can roll another d8, and add it to the damage. When you cast this spell, the maximum number of these d8s you can add to the spell's damage equals your spellcasting ability modifier.","The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).",""],"sparethedying":["Spare the Dying","Necromancy",0,"Choose a creature within range that has 0 Hit Points and isn't dead. The creature becomes Stable.","The range doubles when you reach levels 5 (30 feet), 11 (60 feet), and 17 (120 feet).",""],"speakwithanimals":["Speak with Animals","Divination",1,"For the duration, you can comprehend and verbally communicate with Beasts, and you can use any of the Influence action's skill options with them. Most Beasts have little to say about topics that don't pertain to survival or companionship, but at minimum, a Beast can give you information about nearby locations and monsters, including whatever it has perceived within the past day.","",""],"speakwithdead":["Speak with Dead","Necromancy",3,"You grant the semblance of life to a corpse of your choice within range, allowing it to answer questions you pose. The corpse must have a mouth, and this spell fails if the deceased creature was Undead when it died. The spell also fails if the corpse was the target of this spell within the past 10 days. Until the spell ends, you can ask the corpse up to five questions. The corpse knows only what it knew in life, including the languages it knew. Answers are usually brief, cryptic, or repetitive, and the corpse is under no compulsion to offer a truthful answer if you are antagonistic toward it or it recognizes you as an enemy. This spell doesn't return the creature's soul to its body, only its animating spirit. Thus, the corpse can't learn new information, doesn't comprehend anything that has happened since it died, and can't speculate about future events.","","burning incense"],"speakwithplants":["Speak with Plants","Transmutation",3,"You imbue plants in an immobile 30-foot Emanation with limited sentience and animation, giving them the ability to communicate with you and follow your simple commands. You can question plants about events in the spell's area within the past day, gaining information about creatures that have passed, weather, and other circumstances. You can also turn Difficult Terrain caused by plant growth (such as thickets and undergrowth) into ordinary terrain that lasts for the duration. Or you can turn ordinary terrain where plants are present into Difficult Terrain that lasts for the duration. The spell doesn't enable plants to uproot themselves and move about, but they can move their branches, tendrils, and stalks for you. If a Plant creature is in the area, you can communicate with it as if you shared a common language.","",""],"spiderclimb":["Spider Climb","Transmutation",2,"Until the spell ends, one willing creature you touch gains the ability to move up, down, and across vertical surfaces and along ceilings, while leaving its hands free. The target also gains a Climb Speed equal to its Speed.","You can target one additional creature for each spell slot level above 2.","a drop of bitumen and a spider"],"spikegrowth":["Spike Growth","Transmutation",2,"The ground in a 20-foot-radius Sphere centered on a point within range sprouts hard spikes and thorns. The area becomes Difficult Terrain for the duration. When a creature moves into or within the area, it takes 2d4 Piercing damage for every 5 feet it travels. The transformation of the ground is camouflaged to look natural. Any creature that can't see the area when the spell is cast must take a Search action and succeed on a Wisdom (Perception or Survival) check against your spell save DC to recognize the terrain as hazardous before entering it.","","seven thorns"],"spiritguardians":["Spirit Guardians","Conjuration",3,"Protective spirits flit around you in a 15-foot Emanation for the duration. If you are good or neutral, their spectral form appears angelic or fey (your choice). If you are evil, they appear fiendish. When you cast this spell, you can designate creatures to be unaffected by it. Any other creature's Speed is halved in the Emanation, and whenever the Emanation enters a creature's space and whenever a creature enters the Emanation or ends its turn there, the creature must make a Wisdom saving throw. On a failed save, the creature takes 3d8 Radiant damage (if you are good or neutral) or 3d8 Necrotic damage (if you are evil). On a successful save, the creature takes half as much damage. A creature makes this save only once per turn.","The damage increases by 1d8 for each spell slot level above 3.","a prayer scroll"],"spiritualweapon":["Spiritual Weapon","Evocation",2,"You create a floating, spectral force that resembles a weapon of your choice and lasts for the duration. The force appears within range in a space of your choice, and you can immediately make one melee spell attack against one creature within 5 feet of the force. On a hit, the target takes Force damage equal to 1d8 plus your spellcasting ability modifier. As a Bonus Action on your later turns, you can move the force up to 20 feet and repeat the attack against a creature within 5 feet of it.","The damage increases by 1d8 for every slot level above 2.",""],"starrywisp":["Starry Wisp","Evocation",0,"You launch a mote of light at one creature or object within range. Make a ranged spell attack against the target. On a hit, the target takes 1d8 Radiant damage, and until the end of your next turn, it emits Dim Light in a 10-foot radius and can't benefit from the Invisible condition.","The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).",""],"stinkingcloud":["Stinking Cloud","Conjuration",3,"You create a 20-foot-radius Sphere of yellow, nauseating gas centered on a point within range. The cloud is Heavily Obscured. The cloud lingers in the air for the duration or until a strong wind (such as the one created by Gust of Wind) disperses it. Each creature that starts its turn in the Sphere must succeed on a Constitution saving throw or have the Poisoned condition until the end of the current turn. While Poisoned in this way, the creature can't take an action or a Bonus Action.","","a rotten egg"],"stoneshape":["Stone Shape","Transmutation",4,"You touch a stone object of Medium size or smaller or a section of stone no more than 5 feet in any dimension and form it into any shape you like. For example, you could shape a large rock into a weapon, statue, or coffer, or you could make a small passage through a wall that is 5 feet thick. You could also shape a stone door or its frame to seal the door shut. The object you create can have up to two hinges and a latch, but finer mechanical detail isn't possible.","","soft clay"],"stoneskin":["Stoneskin","Transmutation",4,"Until the spell ends, one willing creature you touch has Resistance to Bludgeoning, Piercing, and Slashing damage.","","diamond dust worth 100+ GP, which the spell consumes"],"stormofvengeance":["Storm of Vengeance","Conjuration",9,"A churning storm cloud forms for the duration, centered on a point within range and spreading to a radius of 300 feet. Each creature under the cloud when it appears must succeed on a Constitution saving throw or take 2d6 Thunder damage and have the Deafened condition for the duration.\n\nAt the start of each of your later turns, the storm produces different effects, as detailed below.\n\n**_Turn 2._** Acidic rain falls. Each creature and object under the cloud takes 4d6 Acid damage.\n\n**_Turn 3._** You call six bolts of lightning from the cloud to strike six different creatures or objects beneath it. Each target makes a Dexterity saving throw, taking 10d6 Lightning damage on a failed save or half as much damage on a successful one.\n\n**_Turn 4._** Hailstones rain down. Each creature under the cloud takes 2d6 Bludgeoning damage.\n\n**_Turns 5–10._** Gusts and freezing rain assail the area under the cloud. Each creature there takes 1d6 Cold damage. Until the spell ends, the area is Difficult Terrain and Heavily Obscured, ranged attacks with weapons are impossible there, and strong wind blows through the area.","",""],"suggestion":["Suggestion","Enchantment",2,"You suggest a course of activity—described in no more than 25 words—to one creature you can see within range that can hear and understand you. The suggestion must sound achievable and not involve anything that would obviously deal damage to the target or its allies. For example, you could say, \"Fetch the key to the cult's treasure vault, and give the key to me.\" Or you could say, \"Stop fighting, leave this library peacefully, and don't return.\" The target must succeed on a Wisdom saving throw or have the Charmed condition for the duration or until you or your allies deal damage to the target. The Charmed target pursues the suggestion to the best of its ability. The suggested activity can continue for the entire duration, but if the suggested activity can be completed in a shorter time, the spell ends for the target upon completing it.","","a drop of honey"],"summondragon":["Summon Dragon","Conjuration",5,"You call forth a Dragon spirit. It manifests in an unoccupied space that you can see within range and uses the Draconic Spirit stat block. The creature disappears when it drops to 0 Hit Points or when the spell ends. The creature is an ally to you and your allies. In combat, the creature shares your Initiative count, but it takes its turn immediately after yours. It obeys your verbal commands (no action required by you). If you don't issue any, it takes the Dodge action and uses its movement to avoid danger.","Use the spell slot's level for the spell's level in the stat block.","an object with the image of a dragon engraved on it worth 500+ GP"],"sunbeam":["Sunbeam","Evocation",6,"You launch a sunbeam in a 5-foot-wide, 60-foot-long Line. Each creature in the Line makes a Constitution saving throw. On a failed save, a creature takes 6d8 Radiant damage and has the Blinded condition until the start of your next turn. On a successful save, it takes half as much damage only. Until the spell ends, you can take a Magic action to create a new Line of radiance. For the duration, a mote of brilliant radiance shines above you. It sheds Bright Light in a 30-foot radius and Dim Light for an additional 30 feet. This light is sunlight.","","a magnifying glass"],"sunburst":["Sunburst","Evocation",8,"Brilliant sunlight flashes in a 60-foot-radius Sphere centered on a point you choose within range. Each creature in the Sphere makes a Constitution saving throw. On a failed save, a creature takes 12d6 Radiant damage and has the Blinded condition for 1 minute. On a successful save, it takes half as much damage only. A creature Blinded by this spell makes another Constitution saving throw at the end of each of its turns, ending the effect on itself on a success. This spell dispels Darkness in its area that was created by any spell.","","a piece of sunstone"],"symbol":["Symbol","Abjuration",7,"You inscribe a harmful glyph either on a surface (such as a section of floor or wall) or within an object that can be closed (such as a book or chest). The glyph can cover an area no larger than 10 feet in diameter. If you choose an object, it must remain in place; if it is moved more than 10 feet from where you cast this spell, the glyph is broken, and the spell ends without being triggered.\n\nThe glyph is nearly imperceptible and requires a successful Wisdom (Perception) check against your spell save DC to notice.\n\nWhen you inscribe the glyph, you set its trigger and choose which effect the symbol bears: Death, Discord, Fear, Pain, Sleep, or Stunning. Each one is explained below.\n\n**_Set the Trigger._** You decide what triggers the glyph when you cast the spell. For glyphs inscribed on a surface, common triggers include touching or stepping on the glyph, removing another object covering it, or approaching within a certain distance of it. For glyphs inscribed within an object, common triggers include opening that object or seeing the glyph.\n\nYou can refine the trigger so that only creatures of certain types activate it (for example, the glyph could be set to affect Aberrations). You can also set conditions for creatures that don't trigger the glyph, such as those who say a certain password.\n\nOnce triggered, the glyph glows, filling a 60-foot-radius Sphere with Dim Light for 10 minutes, after which time the spell ends. Each creature in the Sphere when the glyph activates is targeted by its effect, as is a creature that enters the Sphere for the first time on a turn or ends its turn there. A creature is targeted only once per turn.\n\n**_Death._** Each target makes a Constitution saving throw, taking 10d10 Necrotic damage on a failed save or half as much damage on a successful save.\n\n**_Discord._** Each target makes a Wisdom saving throw. On a failed save, a target argues with other creatures for 1 minute. During this time, it is incapable of meaningful communication and has Disadvantage on attack rolls and ability checks.\n\n**_Fear._** Each target must succeed on a Wisdom saving throw or have the Frightened condition for 1 minute. While Frightened, the target must move at least 30 feet away from the glyph on each of its turns, if able.\n\n**_Pain._** Each target must succeed on a Constitution saving throw or have the Incapacitated condition for 1 minute.\n\n**_Sleep._** Each target must succeed on a Wisdom saving throw or have the Unconscious condition for 10 minutes. A creature awakens if it takes damage or if someone takes an action to shake it awake.\n\n**_Stunning._** Each target must succeed on a Wisdom saving throw or have the Stunned condition for 1 minute.","","powdered diamond worth 1,000+ GP, which the spell consumes"],"telekinesis":["Telekinesis","Transmutation",5,"You gain the ability to move or manipulate creatures or objects by thought. When you cast the spell and as a Magic action on your later turns before the spell ends, you can exert your will on one creature or object that you can see within range, causing the appropriate effect below. You can affect the same target round after round or choose a new one at any time. If you switch targets, the prior target is no longer affected by the spell.\n\n**_Creature._** You can try to move a Huge or smaller creature. The target must succeed on a Strength saving throw, or you move it up to 30 feet in any direction within the spell's range. Until the end of your next turn, the creature has the Restrained condition, and if you lift it into the air, it is suspended there. It falls at the end of your next turn unless you use this option on it again and it fails the save.\n\n**_Object._** You can try to move a Huge or smaller object. If the object isn't being worn or carried, you automatically move it up to 30 feet in any direction within the spell's range.\n\nIf the object is worn or carried by a creature, that creature must succeed on a Strength saving throw, or you pull the object away and move it up to 30 feet in any direction within the spell's range.\n\nYou can exert fine control on objects with your telekinetic grip, such as manipulating a simple tool,","",""],"telepathicbond":["Telepathic Bond","Divination",5,"You forge a telepathic link among up to eight willing creatures of your choice within range, psychically linking each creature to all the others for the duration. Creatures that can't communicate in any languages aren't affected by this spell. Until the spell ends, the targets can communicate telepathically through the bond whether or not they share a language. The communication is possible over any distance, though it can't extend to other planes of existence.","","two eggs"],"teleport":["Teleport","Conjuration",7,"This spell instantly transports you and up to eight willing creatures that you can see within range, or a single object that you can see within range, to a destination you select. If you target an object, it must be Large or smaller, and it can't be held or carried by an unwilling creature. The destination you choose must be known to you, and it must be on the same plane of existence as you. Your familiarity with the destination determines whether you arrive there successfully. The GM rolls 1d100 and consults the Teleportation Outcome table and the explanations after it.\n\n| Familiarity | Mishap | Similar Area | Off Target | On Target |\n|---|---|---|---|---|\n| Permanent circle | — | — | — | 01–00 |\n| Linked object | — | — | — | 01–00 |\n| Very familiar | 01–05 | 06–13 | 14–24 | 25–00 |\n| Seen casually | 01–33 | 34–43 | 44–53 | 54–00 |\n| Viewed once or described | 01–43 | 44–53 | 54–73 | 74–00 |\n| False destination | 01–50 | 51–00 | — | — |\n\n- \"Permanent circle\" means a permanent teleportation circle whose sigil sequence you know.\n- \"Linked object\" means you possess an object taken from the desired destination within the last six months, such as a book from a wizard's library.\n- \"Very familiar\" is a place you have visited often, a place you have carefully studied, or a place you can see when you cast the spell.\n- \"Seen casually\" is a place you have seen more than once but with which you aren't very familiar.\n- \"Viewed once or described\" is a place you have seen once, possibly using magic, or a place you know through someone else's description, perhaps from a map.\n- \"False destination\" is a place that doesn't exist. Perhaps you tried to scry an enemy's sanctum but instead viewed an illusion, or you are attempting to teleport to a location that no longer exists.\n\n**Mishap.** The spell's unpredictable magic results in a difficult journey. Each teleporting creature (or the target object) takes 3d10 Force damage, and the GM rerolls on the table to see where you wind up (multiple mishaps can occur, dealing damage each time).\n\n**Similar Area.** You and your group (or the target object) appear in a different area that's visually or thematically similar to the target area. You appear in the closest similar place. If you are heading for your home laboratory, for example, you might appear in another person's laboratory in the same city.\n\n**Off Target.** You and your group (or the target object) appear 2d12 miles away from the destination in a random direction. Roll 1d8 for the direction: 1, east; 2, southeast; 3, south; 4, southwest; 5, west; 6, northwest; 7, north; or 8, northeast.\n\n**On Target.** You and your group (or the target object) appear where you intended.","",""],"teleportationcircle":["Teleportation Circle","Conjuration",5,"As you cast the spell, you draw a 5-foot-radius circle on the ground inscribed with sigils that link your location to a permanent teleportation circle of your choice whose sigil sequence you know and that is on the same plane of existence as you. A shimmering portal opens within the circle you drew and remains open until the end of your next turn. Any creature that enters the portal instantly appears within 5 feet of the destination circle or in the nearest unoccupied space if that space is occupied. Many major temples, guildhalls, and other important places have permanent teleportation circles. Each circle includes a unique sigil sequence—a string of runes arranged in a particular pattern. When you first gain the ability to cast this spell, you learn the sigil sequences for two destinations on the Material Plane, determined by the GM. You might learn additional sigil sequences during your adventures. You can commit a new sigil sequence to memory after studying it for 1 minute. You can create a permanent teleportation circle by casting this spell in the same location every day for 365 days.","","rare inks worth 50+ GP, which the spell consumes"],"thaumaturgy":["Thaumaturgy","Transmutation",0,"You manifest a minor wonder within range. You create one of the effects below within range. If you cast this spell multiple times, you can have up to three of its 1-minute effects active at a time.\n\n**_Altered Eyes._** You alter the appearance of your eyes for 1 minute.\n\n**_Booming Voice._** Your voice booms up to three times as loud as normal for 1 minute. For the duration, you have Advantage on Charisma (Intimidation) checks.\n\n**_Fire Play._** You cause flames to flicker, brighten, dim, or change color for 1 minute.\n\n**_Invisible Hand._** You instantaneously cause an unlocked door or window to fly open or slam shut.\n\n**_Phantom Sound._** You create an instantaneous sound that originates from a point of your choice within range, such as a rumble of thunder, the cry of a raven, or ominous whispers.\n\n**_Tremors._** You cause harmless tremors in the ground for 1 minute.","",""],"thunderwave":["Thunderwave","Evocation",1,"You unleash a wave of thunderous energy. Each creature in a 15-foot Cube originating from you makes a Constitution saving throw. On a failed save, a creature takes 2d8 Thunder damage and is pushed 10 feet away from you. On a successful save, a creature takes half as much damage only.\n\nIn addition, unsecured objects that are entirely within the Cube are pushed 10 feet away from you, and a thunderous boom is audible within 300 feet.","The damage increases by 1d8 for each spell slot level above 1.",""],"timestop":["Time Stop","Transmutation",9,"You briefly stop the flow of time for everyone but yourself. No time passes for other creatures, while you take 1d4 + 1 turns in a row, during which you can use actions and move as normal. This spell ends if one of the actions you use during this period, or any effects that you create during it, affects a creature other than you or an object being worn or carried by someone other than you. In addition, the spell ends if you move to a place more than 1,000 feet from the location where you cast it.","",""],"tinyhut":["Tiny Hut","Evocation",3,"A 10-foot Emanation springs into existence around you and remains stationary for the duration. The spell fails when you cast it if the Emanation isn't big enough to fully encapsulate all creatures in its area. Creatures and objects within the Emanation when you cast the spell can move through it freely. All other creatures and objects are barred from passing through it. Spells of level 3 or lower can't be cast through it, and the effects of such spells can't extend into it. The atmosphere inside the Emanation is comfortable and dry, regardless of the weather outside. Until the spell ends, you can command the interior to have Dim Light or Darkness (no action required). The Emanation is opaque from the outside and of any color you choose, but it's transparent from the inside. The spell ends early if you leave the Emanation or if you cast it again.","","a crystal bead"],"tongues":["Tongues","Divination",3,"This spell grants the creature you touch the ability to understand any spoken or signed language that it hears or sees. Moreover, when the target communicates by speaking or signing, any creature that knows at least one language can understand it if that creature can hear the speech or see the signing.","","a miniature ziggurat"],"transportviaplants":["Transport via Plants","Conjuration",6,"This spell creates a magical link between a Large or larger inanimate plant within range and another plant, at any distance, on the same plane of existence. You must have seen or touched the destination plant at least once before. For the duration, any creature can step into the target plant and exit from the destination plant by using 5 feet of movement.","",""],"treestride":["Tree Stride","Conjuration",5,"You gain the ability to enter a tree and move from inside it to inside another tree of the same kind within 500 feet. Both trees must be living and at least the same size as you. You must use 5 feet of movement to enter a tree. You instantly know the location of all other trees of the same kind within 500 feet and, as part of the move used to enter the tree, can either pass into one of those trees or step out of the tree you're in. You appear in a spot of your choice within 5 feet of the destination tree, using another 5 feet of movement. If you have no movement left, you appear within 5 feet of the tree you entered. You can use this transportation ability only once on each of your turns. You must end each turn outside a tree.","",""],"truepolymorph":["True Polymorph","Transmutation",9,"Choose one creature or nonmagical object that you can see within range. The creature shape-shifts into a different creature or a nonmagical object, or the object shape-shifts into a creature (the object must be neither worn nor carried). The transformation lasts for the duration or until the target dies or is destroyed, but if you maintain Concentration on this spell for the full duration, the spell lasts until dispelled.\n\nAn unwilling creature can make a Wisdom saving throw, and if it succeeds, it isn't affected by this spell.\n\n**_Creature into Creature._** If you turn a creature into another kind of creature, the new form can be any kind you choose that has a Challenge Rating equal to or less than the target's Challenge Rating or level. The target's game statistics are replaced by the stat block of the new form, but it retains its Hit Points, Hit Point Dice, alignment, and personality.\n\nThe target gains a number of Temporary Hit Points equal to the Hit Points of the new form. These Temporary Hit Points vanish if any remain when the spell ends. The target is limited in the actions it can perform by the anatomy of its new form, and it can't speak or cast spells.\n\nThe target's gear melds into the new form. The creature can't use or otherwise benefit from any of that equipment.\n\n**_Object into Creature._** You can turn an object into any kind of creature, as long as the creature's size is no larger than the object's size and the creature has a Challenge Rating of 9 or lower. The creature is Friendly to you and your allies. In combat, it takes its turns immediately after yours, and it obeys your commands.\n\nIf the spell lasts more than an hour, you no longer control the creature. It might remain Friendly to you, depending on how you have treated it.\n\n**_Creature into Object._** If you turn a creature into an object, it transforms along with whatever it is wearing and carrying into that form, as long as the object's size is no larger than the creature's size. The creature's statistics become those of the object, and the creature has no memory of time spent in this form after the spell ends and it returns to normal.","","a drop of mercury, a dollop of gum arabic, and a wisp of smoke"],"trueresurrection":["True Resurrection","Necromancy",9,"You touch a creature that has been dead for no longer than 200 years and that died for any reason except old age. The creature is revived with all its Hit Points. This spell closes all wounds, neutralizes any poison, cures all magical contagions, and lifts any curses affecting the creature when it died. The spell replaces damaged or missing organs and limbs. If the creature was Undead, it is restored to its non-Undead form. The spell can provide a new body if the original no longer exists, in which case you must speak the creature's name. The creature then appears in an unoccupied space you choose within 10 feet of you.","","diamonds worth 25,000+ GP, which the spell consumes"],"trueseeing":["True Seeing","Divination",6,"For the duration, the willing creature you touch has Truesight with a range of 120 feet.","","mushroom powder worth 25+ GP, which the spell consumes"],"truestrike":["True Strike","Divination",0,"Guided by a flash of magical insight, you make one attack with the weapon used in the spell's casting. The attack uses your spellcasting ability for the attack and damage rolls instead of using Strength or Dexterity. If the attack deals damage, it can be Radiant damage or the weapon's normal damage type (your choice).","Whether you deal Radiant damage or the weapon's normal damage type, the attack deals extra Radiant damage when you reach levels 5 (1d6), 11 (2d6), and 17 (3d6).","a weapon with which you have proficiency and that is worth 1+ CP"],"tsunami":["Tsunami","Conjuration",8,"A wall of water springs into existence at a point you choose within range. You can make the wall up to 300 feet long, 300 feet high, and 50 feet thick. The wall lasts for the duration. When the wall appears, each creature in its area makes a Strength saving throw, taking 6d10 Bludgeoning damage on a failed save or half as much damage on a successful one. At the start of each of your turns after the wall appears, the wall, along with any creatures in it, moves 50 feet away from you. Any Huge or smaller creature inside the wall or whose space the wall enters when it moves must succeed on a Strength saving throw or take 5d10 Bludgeoning damage. A creature can take this damage only once per round. At the end of the turn, the wall's height is reduced by 50 feet, and the damage the wall deals on later rounds is reduced by 1d10. When the wall reaches 0 feet in height, the spell ends. A creature caught in the wall can move by swimming. Because of the wave's force, though, the creature must succeed on a Strength (Athletics) check against your spell save DC to move at all. If it fails the check, it can't move. A creature that moves out of the wall falls to the ground. ### U-Z Spells","",""],"unseenservant":["Unseen Servant","Conjuration",1,"This spell creates an Invisible, mindless, shapeless, Medium force that performs simple tasks at your command until the spell ends. The servant springs into existence in an unoccupied space on the ground within range. It has AC 10, 1 Hit Point, and a Strength of 2, and it can't attack. If it drops to 0 Hit Points, the spell ends. Once on each of your turns as a Bonus Action, you can mentally command the servant to move up to 15 feet and interact with an object. The servant can perform simple tasks that a human could do, such as fetching things, cleaning, mending, folding clothes, lighting fires, serving food, and pouring drinks. Once you give the command, the servant performs the task to the best of its ability until it completes the task, then waits for your next command. If you command the servant to perform a task that would move it more than 60 feet away from you, the spell ends.","","a bit of string and of wood"],"vampirictouch":["Vampiric Touch","Necromancy",3,"The touch of your shadow-wreathed hand can siphon life force from others to heal your wounds. Make a melee spell attack against one creature within reach. On a hit, the target takes 3d6 Necrotic damage, and you regain Hit Points equal to half the amount of Necrotic damage dealt. Until the spell ends, you can make the attack again on each of your turns as a Magic action, targeting the same creature or a different one.","The damage increases by 1d6 for each spell slot level above 3.",""],"viciousmockery":["Vicious Mockery","Enchantment",0,"You unleash a string of insults laced with subtle enchantments at one creature you can see or hear within range. The target must succeed on a Wisdom saving throw or take 1d6 Psychic damage and have Disadvantage on the next attack roll it makes before the end of its next turn.","The damage increases by 1d6 when you reach levels 5 (2d6), 11 (3d6), and 17 (4d6).",""],"vitriolicsphere":["Vitriolic Sphere","Evocation",4,"You point at a location within range, and a glowing, 1-foot-diameter ball of acid streaks there and explodes in a 20-foot-radius Sphere. Each creature in that area makes a Dexterity saving throw. On a failed save, a creature takes 10d4 Acid damage and another 5d4 Acid damage at the end of its next turn. On a successful save, a creature takes half the initial damage only.","The initial damage increases by 2d4 for each spell slot level above 4.","a drop of bile"],"walloffire":["Wall of Fire","Evocation",4,"You create a wall of fire on a solid surface within range. You can make the wall up to 60 feet long, 20 feet high, and 1 foot thick, or a ringed wall up to 20 feet in diameter, 20 feet high, and 1 foot thick. The wall is opaque and lasts for the duration. When the wall appears, each creature in its area makes a Dexterity saving throw, taking 5d8 Fire damage on a failed save or half as much damage on a successful one. One side of the wall, selected by you when you cast this spell, deals 5d8 Fire damage to each creature that ends its turn within 10 feet of that side or inside the wall. A creature takes the same damage when it enters the wall for the first time on a turn or ends its turn there. The other side of the wall deals no damage.","The damage increases by 1d8 for each spell slot level above 4.","a piece of charcoal"],"wallofforce":["Wall of Force","Evocation",5,"An Invisible wall of force springs into existence at a point you choose within range. The wall appears in any orientation you choose, as a horizontal or vertical barrier or at an angle. It can be free floating or resting on a solid surface. You can form it into a hemispherical dome or a globe with a radius of up to 10 feet, or you can shape a flat surface made up of ten 10-foot-by-10-foot panels. Each panel must be contiguous with another panel. In any form, the wall is 1/4 inch thick and lasts for the duration. If the wall cuts through a creature's space when it appears, the creature is pushed to one side of the wall (you choose which side). Nothing can physically pass through the wall. It is immune to all damage and can't be dispelled by Dispel Magic. A Disintegrate spell destroys the wall instantly, however. The wall also extends into the Ethereal Plane and blocks ethereal travel through the wall.","","a shard of glass"],"wallofice":["Wall of Ice","Evocation",6,"You create a wall of ice on a solid surface within range. You can form it into a hemispherical dome or a globe with a radius of up to 10 feet, or you can shape a flat surface made up of ten 10-foot-square panels. Each panel must be contiguous with another panel. In any form, the wall is 1 foot thick and lasts for the duration. If the wall cuts through a creature's space when it appears, the creature is pushed to one side of the wall (you choose which side) and makes a Dexterity saving throw, taking 10d6 Cold damage on a failed save or half as much damage on a successful one. The wall is an object that can be damaged and thus breached. It has AC 12 and 30 Hit Points per 10-foot section, and it has Immunity to Cold, Poison, and Psychic damage and Vulnerability to Fire damage. Reducing a 10-foot section of wall to 0 Hit Points destroys it and leaves behind a sheet of frigid air in the space the wall occupied. A creature moving through the sheet of frigid air for the first time on a turn makes a Constitution saving throw, taking 5d6 Cold damage on a failed save or half as much damage on a successful one.","The damage the wall deals when it appears increases by 2d6 and the damage from passing through the sheet of frigid air increases by 1d6 for each spell slot level above 6.","a piece of quartz"],"wallofstone":["Wall of Stone","Evocation",5,"A nonmagical wall of solid stone springs into existence at a point you choose within range. The wall is 6 inches thick and is composed of ten 10-foot-by-10-foot panels. Each panel must be contiguous with another panel. Alternatively, you can create 10-footby-20-foot panels that are only 3 inches thick. If the wall cuts through a creature's space when it appears, the creature is pushed to one side of the wall (you choose which side). If a creature would be surrounded on all sides by the wall (or the wall and another solid surface), that creature can make a Dexterity saving throw. On a success, it can use its Reaction to move up to its Speed so that it is no longer enclosed by the wall. The wall can have any shape you desire, though it can't occupy the same space as a creature or object. The wall doesn't need to be vertical or rest on a firm foundation. It must, however, merge with and be solidly supported by existing stone. Thus, you can use this spell to bridge a chasm or create a ramp. If you create a span greater than 20 feet in length, you must halve the size of each panel to create supports. You can crudely shape the wall to create battlements and the like. The wall is an object made of stone that can be damaged and thus breached. Each panel has AC 15 and 30 Hit Points per inch of thickness, and it has Immunity to Poison and Psychic damage. Reducing a panel to 0 Hit Points destroys it and might cause connected panels to collapse at the GM's discretion. If you maintain your Concentration on this spell for its full duration, the wall becomes permanent and can't be dispelled. Otherwise, the wall disappears when the spell ends.","","a cube of granite"],"wallofthorns":["Wall of Thorns","Conjuration",6,"You create a wall of tangled brush bristling with needle-sharp thorns. The wall appears within range on a solid surface and lasts for the duration. You choose to make the wall up to 60 feet long, 10 feet high, and 5 feet thick or a circle that has a 20-foot diameter and is up to 20 feet high and 5 feet thick. The wall blocks line of sight. When the wall appears, each creature in its area makes a Dexterity saving throw, taking 7d8 Piercing damage on a failed save or half as much damage on a successful one. A creature can move through the wall, albeit slowly and painfully. For every 1 foot a creature moves through the wall, it must spend 4 feet of movement. Furthermore, the first time a creature enters a space in the wall on a turn or ends its turn there, the creature makes a Dexterity saving throw, taking 7d8 Slashing damage on a failed save or half as much damage on a successful one. A creature makes this save only once per turn.","Both types of damage increase by 1d8 for each spell slot level above 6.","a handful of thorns"],"wardingbond":["Warding Bond","Abjuration",2,"You touch another creature that is willing and create a mystic connection between you and the target until the spell ends. While the target is within 60 feet of you, it gains a +1 bonus to AC and saving throws, and it has Resistance to all damage. Also, each time it takes damage, you take the same amount of damage. The spell ends if you drop to 0 Hit Points or if you and the target become separated by more than 60 feet. It also ends if the spell is cast again on either of the connected creatures.","","a pair of platinum rings worth 50+ GP each, which you and the target must wear for the duration"],"waterbreathing":["Water Breathing","Transmutation",3,"This spell grants up to ten willing creatures of your choice within range the ability to breathe underwater until the spell ends. Affected creatures also retain their normal mode of respiration.","","a short reed"],"waterwalk":["Water Walk","Transmutation",3,"This spell grants the ability to move across any liquid surface—such as water, acid, mud, snow, quicksand, or lava—as if it were harmless solid ground (creatures crossing molten lava can still take damage from the heat). Up to ten willing creatures of your choice within range gain this ability for the duration. An affected target must take a Bonus Action to pass from the liquid's surface into the liquid itself and vice versa, but if the target falls into the liquid, the target passes through the surface into the liquid below.","","a piece of cork"],"web":["Web","Conjuration",2,"You conjure a mass of sticky webbing at a point within range. The webs fill a 20-foot Cube there for the duration. The webs are Difficult Terrain, and the area within them is Lightly Obscured. If the webs aren't anchored between two solid masses (such as walls or trees) or layered across a floor, wall, or ceiling, the web collapses on itself, and the spell ends at the start of your next turn. Webs layered over a flat surface have a depth of 5 feet. The first time a creature enters the webs on a turn or starts its turn there, it must succeed on a Dexterity saving throw or have the Restrained condition while in the webs or until it breaks free. A creature Restrained by the webs can take an action to make a Strength (Athletics) check against your spell save DC. If it succeeds, it is no longer Restrained. The webs are flammable. Any 5-foot Cube of webs exposed to fire burns away in 1 round, dealing 2d4 Fire damage to any creature that starts its turn in the fire.","","a bit of spiderweb"],"weird":["Weird","Illusion",9,"You try to create illusory terrors in others' minds. Each creature of your choice in a 30-foot-radius Sphere centered on a point within range makes a Wisdom saving throw. On a failed save, a target takes 10d10 Psychic damage and has the Frightened condition for the duration. On a successful save, a target takes half as much damage only. A Frightened target makes a Wisdom saving throw at the end of each of its turns. On a failed save, it takes 5d10 Psychic damage. On a successful save, the spell ends on that target.","",""],"windwalk":["Wind Walk","Transmutation",6,"You and up to ten willing creatures of your choice within range assume gaseous forms for the duration, appearing as wisps of cloud. While in this cloud form, a target has a Fly Speed of 300 feet and can hover; it has Immunity to the Prone condition; and it has Resistance to Bludgeoning, Piercing, and Slashing damage. The only actions a target can take in this form are the Dash action or a Magic action to begin reverting to its normal form. Reverting takes 1 minute, during which the target has the Stunned condition. Until the spell ends, the target can revert to cloud form, which also requires a Magic action followed by a 1-minute transformation. If a target is in cloud form and flying when the effect ends, the target descends 60 feet per round for 1 minute until it lands, which it does safely. If it can't land after 1 minute, it falls the remaining distance.","","a candle"],"windwall":["Wind Wall","Evocation",3,"A wall of strong wind rises from the ground at a point you choose within range. You can make the wall up to 50 feet long, 15 feet high, and 1 foot thick. You can shape the wall in any way you choose so long as it makes one continuous path along the ground. The wall lasts for the duration. When the wall appears, each creature in its area makes a Strength saving throw, taking 4d8 Bludgeoning damage on a failed save or half as much damage on a successful one. The strong wind keeps fog, smoke, and other gases at bay. Small or smaller flying creatures or objects can't pass through the wall. Loose, lightweight materials brought into the wall fly upward. Arrows, bolts, and other ordinary projectiles launched at targets behind the wall are deflected upward and miss automatically. Boulders hurled by Giants or siege engines, and similar projectiles, are unaffected. Creatures in gaseous form can't pass through it.","","a fan and a feather"],"wish":["Wish","Conjuration",9,"*Wish* is the mightiest spell a mortal can cast. By simply speaking aloud, you can alter reality itself.\n\nThe basic use of this spell is to duplicate any other spell of level 8 or lower. If you use it this way, you don't need to meet any requirements to cast that spell, including costly components. The spell simply takes effect.\n\nAlternatively, you can create one of the following effects of your choice:\n\n**_Object Creation._** You create one object of up to 25,000 GP in value that isn't a magic item. The object can be no more than 300 feet in any dimension, and it appears in an unoccupied space that you can see on the ground.\n\n**_Instant Health._** You allow yourself and up to twenty creatures that you can see to regain all Hit Points, and you end all effects on them listed in the *Greater Restoration* spell.\n\n**_Resistance._** You grant up to ten creatures that you can see Resistance to one damage type that you choose. This Resistance is permanent.\n\n**_Spell Immunity._** You grant up to ten creatures you can see immunity to a single spell or other magical effect for 8 hours.\n\n**_Sudden Learning._** You replace one of your feats with another feat for which you are eligible. You lose all the benefits of the old feat and gain the benefits of the new one. You can't replace a feat that is a prerequisite for any of your other feats or features.\n\n**_Roll Redo._** You undo a single recent event by forcing a reroll of any die roll made within the last round (including your last turn). Reality reshapes itself to accommodate the new result. For example, a *Wish* spell could undo an ally's failed saving throw or a foe's Critical Hit. You can force the reroll to be made with Advantage or Disadvantage, and you choose whether to use the reroll or the original roll.\n\n**_Reshape Reality._** You may wish for something not included in any of the other effects. To do so, state your wish to the GM as precisely as possible. The GM has great latitude in ruling what occurs in such an instance; the greater the wish, the greater the likelihood that something goes wrong. This spell might simply fail, the effect you desire might be achieved only in part, or you might suffer an unforeseen consequence as a result of how you worded the wish. For example, wishing that a villain were dead might propel you forward in time to a period when that villain is no longer alive, effectively removing you from the game.\n\nSimilarly, wishing for a Legendary magic item or an Artifact might instantly transport you to the presence of the item's current owner. If your wish is granted and its effects have consequences for a whole community, region, or world, you are likely to attract powerful foes. If your wish would affect a god, the god's divine servants might instantly intervene to prevent it or to encourage you to craft the wish in a particular way. If your wish would undo the multiverse itself, your wish fails.\n\nThe stress of casting *Wish* to produce any effect other than duplicating another spell weakens you. After enduring that stress, each time you cast a spell until you finish a Long Rest, you take 1d10 Necrotic damage per level of that spell. This damage can't be reduced or prevented in any way. In addition, your Strength score becomes 3 for 2d4 days. For each of those days that you spend resting and doing nothing more than light activity, your remaining recovery time decreases by 2 days. Finally, there is a 33 percent chance that you are unable to cast *Wish* ever again if you suffer this stress.","",""],"wordofrecall":["Word of Recall","Conjuration",6,"You and up to five willing creatures within 5 feet of you instantly teleport to a previously designated sanctuary. You and any creatures that teleport with you appear in the nearest unoccupied space to the spot you designated when you prepared your sanctuary (see below). If you cast this spell without first preparing a sanctuary, the spell has no effect. You must designate a location, such as a temple, as a sanctuary by casting this spell there.","",""],"zoneoftruth":["Zone of Truth","Enchantment",2,"You create a magical zone that guards against deception in a 15-foot-radius Sphere centered on a point within range. Until the spell ends, a creature that enters the spell's area for the first time on a turn or starts its turn there makes a Charisma saving throw. On a failed save, a creature can't speak a deliberate lie while in the radius. You know whether a creature succeeds or fails on this save. An affected creature is aware of the spell and can avoid answering questions to which it would normally respond with a lie. Such a creature can be evasive yet must be truthful.","",""]},"alias":{"bigbyshand":"arcanehand","drawmijsinstantsummons":"instantsummons","evardsblacktentacles":"blacktentacles","leomundssecretchest":"secretchest","leomundstinyhut":"tinyhut","melfsacidarrow":"acidarrow","mordenkainensfaithfulhound":"faithfulhound","mordenkainensmagnificentmansion":"magnificentmansion","mordenkainensprivatesanctum":"privatesanctum","mordenkainenssword":"arcanesword","nystulsmagicaura":"arcanistsmagicaura","otilukesfreezingsphere":"freezingsphere","otilukesresilientsphere":"resilientsphere","ottosirresistibledance":"irresistibledance","rarystelepathicbond":"telepathicbond","tashashideouslaughter":"hideouslaughter","tensersfloatingdisk":"floatingdisk"}};

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s)}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function sgn(n){n=n||0;return (n<0?'\u2212':'+')+Math.abs(n)}
function d(n){return Math.floor(Math.random()*n)+1}
function rolls(n,s){var r=[];for(var i=0;i<n;i++)r.push(d(s));return r}
function sum(a){return a.reduce(function(x,y){return x+y},0)}
function paras(t){return String(t||'').split('\n').filter(Boolean).map(function(p){return '<p>'+esc(p)+'</p>'}).join('')}
function clone(o){return JSON.parse(JSON.stringify(o))}
function dmgParse(s){
  var m=String(s||'').match(/^\s*(?:(\d+)\s*d\s*(\d+))?\s*(?:([+-])?\s*(\d+))?\s*(.*)$/i)||[];
  var n=m[1]?+m[1]:0,dd=m[2]?+m[2]:0,mod=0;
  if(m[4]){mod=+m[4];if(m[3]==='-')mod=-mod}
  return {n:n,d:dd,mod:mod,type:(m[5]||'').trim().toLowerCase()};
}
function diceExpr(s){
  var m=String(s).match(/(\d+)\s*d\s*(\d+)\s*(?:([+-])\s*(\d+))?/i);if(!m)return null;
  var mod=m[4]?+m[4]:0;if(m[3]==='-')mod=-mod;
  return {n:+m[1],d:+m[2],mod:mod};
}

/* ---------- model derived from imported features ---------- */
function usagesOf(f){return f.usages&&f.usages.length?f.usages:(f.uses?[f.uses]:[])}
function tkName(f,u){
  var n=u.name;
  if(u.rest==='other'&&n.indexOf(': ')>0)return n.split(': ')[0];
  if(n.indexOf(f.name+': ')===0)return n.slice(f.name.length+2);
  return n;
}
function tkRe(name){return new RegExp('\\b'+name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/s$/,'')+'s?\\b','i')}
function buildModel(ch){
  var M={trackers:[],bonus:[],reaction:[],other:[],addons:[],perAction:1,savage:false,dieSize:0,sdId:null,spId:null,maneuverDC:null,onlyOne:false,resourceful:false,riders:[],effects:{},spCost:{},spells:ch.spells||null};
  var all=ch.features.map(function(f){return f.text||''}).join('\n');
  ch.features.forEach(function(f){
    usagesOf(f).forEach(function(u){
      var nm=tkName(f,u),id=dbSlug(nm);
      for(var i=0;i<M.trackers.length;i++)if(M.trackers[i].id===id)return;
      M.trackers.push({id:id,name:nm,max:u.max,rest:u.rest,shortRegain:(nm===f.name&&/regain one expended use when you finish a short rest/i.test(f.text||''))?1:0});
    });
    if(f.name==='Resourceful')M.resourceful=true;
  });
  var m,re=/(\d+)\s*SP\s*->\s*Spell Slot Level\s*(\d+)/g;
  while((m=re.exec(all)))M.spCost[+m[2]]=+m[1];
  if((m=all.match(/(\d+)d(\d+)\s+Superiority Dice/i)))M.dieSize=+m[2];
  M.trackers.forEach(function(t){if(/superiority/i.test(t.name))M.sdId=t.id;if(/^sorcery points$/i.test(t.name))M.spId=t.id});
  var ea=all.match(/attack (\d+) times/i);if(ea)M.perAction=Math.max(1,+ea[1]);
  M.savage=/roll the weapon.{0,3}s damage dice twice/i.test(all);
  M.onlyOne=/only use one maneuver per attack/i.test(all);
  if(/DC equals 8 \+ Strength\/Dexterity modifier/i.test(all)){
    M.maneuverDC=8+ch.profBonus+Math.max(ch.abilities.str.mod,ch.abilities.dex.mod);
  }
  function mk(f,name,act,text,opt){
    var e={id:dbSlug((f.name||'')+'-'+name),name:name,activation:act,text:text,more:[],parent:f.name,trk:null,heal:null,usesDie:false,attackAfter:false,adv:false,melee:false,roll:null,mentions:[],give:null,temp:false,effect:null,slotCreate:0,cost:0,regainSP:0};
    var u0=usagesOf(f)[0];
    if(u0&&!opt)e.trk=dbSlug(tkName(f,u0));
    var hm=text.match(/regain\s+(\d+d\d+(?:\s*[+-]\s*\d+)?)\s*(?:hit points|HP)/i);if(hm)e.heal=hm[1].replace(/\s+/g,'');
    if(/expend one Superiority Die/i.test(text)&&M.sdId){e.usesDie=true;if(/attack roll|attack/i.test(text)){e.attackAfter=true;e.melee=/melee attack/i.test(text);e.adv=/has Advantage/i.test(text)}}
    if(!e.attackAfter&&/Advantage on your next attack roll/i.test(text)){e.attackAfter=true;e.adv=true}
    var rm=text.match(/roll\s+(\d+d\d+)\s+and add/i);if(rm)e.roll=rm[1];
    var gm=text.match(/\((\d+d\d+)\)/);
    if(gm&&/Inspiration (die|dice)/i.test(text)){e.give=gm[1];e.roll=gm[1];e.temp=/two times the number rolled/i.test(text)}
    var sc=name.match(/Create Spell Slot Level (\d+)/i);
    if(sc){e.slotCreate=+sc[1];e.cost=M.spCost[e.slotCreate]||0}
    var rg=text.match(/regain up to (\d+) Sorcery Points/i);if(rg)e.regainSP=+rg[1];
    if(act==='reaction'&&/Opportunity Attack/i.test(text+' '+(f.text||'')))e.attackAfter=true,e.melee=true;
    M.trackers.forEach(function(t){
      if(t.rest==='other'||t.id===e.trk)return;
      if(e.usesDie&&t.id===M.sdId)return;
      if((e.regainSP||e.slotCreate)&&t.id===M.spId)return;
      if(tkRe(t.name).test(text))e.mentions.push(t.id);
    });
    return e;
  }
  function paraFor(f,label){
    var sub=label.indexOf(f.name+': ')===0?label.slice(f.name.length+2):'';
    var ps=(f.paras||[]).slice(),main=null,more=[];
    if(sub){
      ps.forEach(function(p){if(!main&&p.toLowerCase().indexOf(sub.toLowerCase()+'.')===0)main=p.slice(sub.length+1).trim();else if(!/^Ability Score Increase/i.test(p))more.push(p)});
    }
    return {text:main||(sub?(ps[0]||''):ps.join('\n')),more:main?more:[]};
  }
  function put(e){if(e.activation==='bonus')M.bonus.push(e);else if(e.activation==='reaction')M.reaction.push(e);else M.other.push(e)}
  ch.features.forEach(function(f){
    var ft=f.text||'';
    var rmatch=/once per turn/i.test(ft)?ft.match(/extra\s+(\d+d\d+)\s+(?:\w+\s+)?damage/i):null;
    if(rmatch){M.riders.push({id:dbSlug(f.name),name:f.name,dice:rmatch[1],text:ft,needsFinesse:/Finesse or Ranged/i.test(ft),once:true});return}
    var af=ft.match(/roll a (d\d+)[^.]*bonus to one of the spell.s damage rolls/i);
    if(af){M.riders.push({id:dbSlug(f.name),name:f.name,dice:'1'+af[1],text:ft,spellOnly:true,once:false});return}
    f.acts.forEach(function(a){
      var pf=paraFor(f,a.label),e=mk(f,a.label,a.activation,pf.text,false);e.more=pf.more;
      var tid=dbSlug(a.label),u0=usagesOf(f)[0];
      if(M.trackers.some(function(t){return t.id===tid}))e.trk=tid;
      else if(a.label===f.name&&u0)e.trk=dbSlug(tkName(f,u0));
      else e.trk=null;
      put(e);
    });
    if(!f.acts.length&&(f.activation==='bonus'||f.activation==='reaction'||f.activation==='special')){
      var e2=mk(f,f.name,f.activation,ft,false);
      var efo=f.options.filter(function(o){return /^Activate /i.test(o.name)})[0];
      if(efo){
        var et=efo.text||'';
        e2.effect={id:dbSlug(f.name),name:f.name,text:et,dc:(et.match(/save DC[^.]*increases by (\d+)/i)||[0,0])[1]*1,adv:/Advantage on the attack rolls of [^.]*spells/i.test(et)};
        M.effects[e2.effect.id]=e2.effect;
      }
      put(e2);
    }
    f.options.forEach(function(o){
      var isMan=/maneuver/i.test(f.name)||/Superiority Die/i.test(o.text||'');
      if(o.activation==='bonus'||o.activation==='reaction'){put(mk(f,o.name,o.activation,o.text||'',true))}
      else if(o.activation==='action'&&isMan&&M.dieSize){
        var sv=(o.text||'').match(/\b(Str|Dex|Con|Int|Wis|Cha)\w*\.?\s+saving throw/i);
        M.addons.push({id:dbSlug(o.name),name:o.name,text:o.text||'',save:sv?sv[1]:''});
      }
    });
  });
  return M;
}

function masteryOf(a){
  return Object.keys(MASTERY).filter(function(w){return new RegExp('\\b'+w+'\\b','i').test(a.notes||'')});
}

function reconcile(c){
  var mm=buildModel(c.char),p=c.play;
  p.trk=p.trk||{};p.once=p.once||{};p.fav=p.fav||{};p.free=p.free||{};p.effects=p.effects||{};p.slots=p.slots||{};
  mm.trackers.forEach(function(t){if(p.trk[t.id]==null)p.trk[t.id]=t.max});
  var sl=(c.char.spells&&c.char.spells.slots)||{};
  Object.keys(sl).forEach(function(l){if(p.slots[l]==null)p.slots[l]=sl[l]});
  p.hd=p.hd||{};var hi=hdInit(c.char);Object.keys(hi).forEach(function(k){if(p.hd[k]==null)p.hd[k]=hi[k]});
  if(!p.sf)p.sf='all';if(p.sq==null)p.sq='';

  var live=groups.filter(function(g){return g.n>0});
  if(!live.length){cb(groups.map(function(){return []}));return}
  if(!manual()){cb(groups.map(function(g){return rolls(g.n,g.x)}));return}

  ask(title+(ADV===1?' (advantage: roll twice and enter both)':ADV===-1?' (disadvantage: roll twice and enter both)':''),gs,function(arr){
    var a=arr[0][0],b=ADV?arr[1][0]:null,used=a;

    else h+='<input type="number" inputmode="numeric" min="'+g.n+'" max="'+(g.n*g.x)+'" data-pg="'+gi+'" data-pk="t" aria-label="'+esc(g.label)+', total" placeholder="Total of '+g.n+' dice ('+g.n+'\u2013'+(g.n*g.x)+')">';
    h+='</div></div>';

function promptOk(){
  var pr=PROMPT;if(!pr)return;

  pr.groups.forEach(function(g,gi){

      for(var k=0;k<g.n;k++){
        var el=$('#sb [data-pg="'+gi+'"][data-pk="'+k+'"]'),n=parseInt(el&&el.value,10);

function aName(a){return a.name+(a.qty>1?' \u00d7'+a.qty:'')}

/* ---------- combat log ---------- */
var LGARM='';
function LG(){if(!S.log)S.log={turn:1,nid:1,entries:[],past:[]};return S.log}
function logAdd(type,data){
  var L=LG(),e={id:L.nid++,t:Date.now(),turn:L.turn,type:type};
  for(var k in data)e[k]=data[k];
  L.entries.push(e);claimLog(e,true);if(L.entries.length>400)L.entries.shift();
  save();return e.id;
}
function logUpd(id,data){
  var L=LG();
  for(var i=L.entries.length-1;i>=0;i--)if(L.entries[i].id===id){if(L.entries[i].undone)return false;for(var k in data)L.entries[i][k]=data[k];claimLog(L.entries[i],false);save();return true}
  return false;
}
function logPlace(holder,type,data){
  if(holder.logId&&logUpd(holder.logId,data))return;
  holder.logId=logAdd(type,data);
}
function syncAttackLog(){
  if(!F||!F.out)return;
  var a=S.char.attacks[F.ai];if(!a)return;
  var parts=[],eff=[];
  if(F.dmg){
    parts.push((F.dmg.p.d?'d'+F.dmg.p.d+' ('+F.dmg.used.join(', ')+')':'')+(F.dmg.p.mod?' '+sgn(F.dmg.p.mod):'')+(F.dmg.p.d?'':String(F.dmg.p.mod)));
    if(F.dmg.b)eff.push('Savage Attacker: kept '+sum(F.dmg.used)+' over '+sum(F.dmg.usedIdx?F.dmg.a:F.dmg.b));
  }
  if(F.pre)parts.push(F.pre.name+' die '+F.pre.value);
  if(F.add){parts.push(F.add.name+' die '+F.add.value);if(F.add.save&&M.maneuverDC)eff.push(F.add.name+': '+F.add.save+' save, DC '+M.maneuverDC)}
  F.riders.forEach(function(r){parts.push(r.name+' ('+r.rolls.join(', ')+')')});
  if(F.out!=='miss')masteryOf(a).forEach(function(w){if(w!=='Graze')eff.push(w)});
  else if(masteryOf(a).indexOf('Graze')>-1)eff.push('Graze');
  var rl=F.roll?{used:F.roll.used,a:F.roll.a,b:F.roll.b,bonus:a.bonus,total:F.roll.used+a.bonus}:null;
  logPlace(F,'attack',{weapon:aName(a),source:F.source||'',out:F.out,roll:rl,total:F.dmg?dmgTotal():null,parts:parts,effects:eff});
}
function logTime(t){try{return new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function logLine(e){
  var m='',sub=[],cls=e.type;
  if(e.type==='attack'){
    m=e.weapon+(e.source?' ('+e.source+')':'')+' \u00b7 '+(e.out==='crit'?'critical hit':e.out==='hit'?'hit':'miss')+(e.total!=null?' \u00b7 '+e.total+' damage':'');
    if(e.roll)sub.push('d20 '+e.roll.used+(e.roll.b!=null?' (rolled '+e.roll.a+' and '+e.roll.b+')':'')+' '+(e.roll.bonus<0?'\u2212 ':'+ ')+Math.abs(e.roll.bonus)+' = '+e.roll.total);
    e.parts.forEach(function(p){if(p)sub.push(p)});
    e.effects.forEach(function(p){sub.push(p)});
  }else if(e.type==='hp'){
    cls='hp '+e.kind;
    m=e.kind==='damage'?'Took '+e.amount+' damage'+(e.temp?' ('+e.temp+' absorbed by temp HP)':''):'Healed '+e.amount+(e.src?' ('+e.src+')':'');
    sub.push('HP '+e.hp+'/'+e.max);
  }else if(e.type==='feature'){m=e.name;if(e.detail)sub.push(e.detail)}
  else if(e.type==='check'){m=e.name+': '+e.total;if(e.detail)sub.push(e.detail)}
  else if(e.type==='spell'){m=e.spell+(e.level?' (level '+e.level+')':'')+' \u00b7 '+(e.total==null?'':e.total+' '+(e.kind==='heal'?'healing':'damage'));e.parts.forEach(function(x){sub.push(x)})}
  else{m=e.text||''}
  return {cls:cls,main:m,sub:sub};
}
function summarize(entries,turns){
  var s={turns:turns,attacks:0,hits:0,crits:0,misses:0,dealt:0,taken:0,healed:0,biggest:0};
  entries.forEach(function(e){
    if(e.undone)return;
    if(e.type==='attack'){
      s.attacks++;if(e.out==='miss')s.misses++;else if(e.out==='crit'){s.crits++;s.hits++}else s.hits++;
      if(e.total!=null&&e.out!=='miss'){s.dealt+=e.total;if(e.total>s.biggest)s.biggest=e.total}
    }else if(e.type==='hp'){if(e.kind==='damage')s.taken+=e.amount;else s.healed+=e.amount}
    else if(e.type==='spell'&&e.kind==='damage'&&e.total!=null){s.dealt+=e.total;if(e.total>s.biggest)s.biggest=e.total}
  });
  return s;
}
function sumGrid(s){
  var items=[['Turns',s.turns],['Attacks',s.attacks],['Hits',s.hits+(s.crits?' ('+s.crits+' crit'+(s.crits>1?'s':'')+')':'')],['Misses',s.misses],['Damage dealt',s.dealt],['Biggest hit',s.biggest],['Damage taken',s.taken],['Healed',s.healed]];
  return '<div class="sumg">'+items.map(function(i){return '<div class="sumi"><b>'+i[1]+'</b><span>'+i[0]+'</span></div>'}).join('')+'</div>';
}
function entriesHtml(list,live){
  if(!list.length)return '<p class="muted">Nothing logged yet. Attacks, damage, healing, feature use and rolls show up here as you play.</p>';
  var h='',turn=null;
  list.forEach(function(e){
    if(e.turn!==turn){turn=e.turn;h+='<div class="lgturn">Turn '+turn+'</div>'}
    var l=logLine(e),btn='',hint='',armed=live&&LGARM==='u'+e.id,can=!!(e.u&&e.u.length)||groupRecs(e).length>0;
    if(live&&!e.undone){
      btn='<button class="lgu'+(armed?' arm':'')+'" data-a="lg-undo" data-id="'+e.id+'">'+(armed?'Tap again':(can?'Undo':'Remove'))+'</button>';
      if(armed){var rt=refundText(groupRecs(e));hint='<small class="lgh">'+(can?(rt?'This will put back: '+esc(rt)+'.':'This undoes the line.'):'This only removes the line. There is nothing to put back.')+'</small>'}
    }
    h+='<div class="lgrow '+l.cls+(e.undone?' undone':'')+(btn?' hasbtn':'')+'"><span class="lt">'+logTime(e.t)+'</span><span class="lb">'+esc(l.main)+(e.undone?' <span class="lgtag">Undone</span>':'')+(l.sub.length?'<small>'+l.sub.map(esc).join(' \u00b7 ')+'</small>':'')+hint+'</span>'+btn+'</div>';
  });

function logText(list,title){
  var lines=[title],turn=null;
  list.forEach(function(e){

function dealtText(){var dl=summarize(LG().entries,LG().turn).dealt;return dl?' \u00b7 '+dl+' dealt':''}
function endCombat(){

       +entriesHtml(c.entries)

function rollDamage(done){
  var a=S.char.attacks[F.ai],p=dmgParse(a.dmg),crit=F.out==='crit';
  var nd=p.n*(crit?2:1),groups=p.d?[{label:'Damage dice',n:nd,x:p.d}]:[];
  if(F.savage&&p.d){groups[0].label='First roll';groups.push({label:'Second roll (Savage Attacker)',n:nd,x:p.d})}
  ask('Roll '+nd+'d'+p.d+(crit?' for the critical hit':'')+' ('+aName(a)+')',groups,function(arr){
    var r1=p.d?arr[0]:[],r2=null,use=r1,idx=0;
    if(F.savage&&p.d){r2=arr[1];if(sum(r2)>sum(r1)){use=r2;idx=1}}
    F.dmg={p:p,a:r1,b:r2,used:use,usedIdx:idx,sum:sum(use),crit:crit};
    if(F.savage&&p.d){S.play.once['savage-attacker']=true;F.savageUsed=true;save()}
    else if(F.savageUsed){delete S.play.once['savage-attacker'];F.savageUsed=false;save()}

function fline(){return '<div class="fline" aria-hidden="true"></div>'}

function attackFlow(a,mast){
  var hit=F.out==='hit'||F.out==='crit',miss=F.out==='miss',h='<div class="flow">';
  var b1=advSeg()+'<button class="btn pri big" data-a="fl-roll">Roll d20 '+sgn(a.bonus)+'</button>';
  if(F.roll){
    var tot=F.roll.used+a.bonus,nat=F.roll.used;
    b1+='<div class="res"><span class="n">'+tot+'</span><span class="d">'+esc(d20Text(F.roll,a.bonus))+(nat===20?'<em>Natural 20: critical hit</em>':nat===1?'<em class="bad">Natural 1: miss</em>':'')+'</span></div>';
  }
  h+=fnode(F.out?'done':'active','Roll to hit',b1)+fline();
  h+='<div class="fq">Does it hit?</div><div class="fbranch">'
   +[['miss','Miss'],['hit','Hit'],['crit','Critical hit']].map(function(o){
      return '<button class="fchoice '+o[0]+(F.out===o[0]?' chosen':(F.out?' dim':''))+'" data-a="fl-out" data-v="'+o[0]+'">'+o[1]+'</button>';
    }).join('')+'</div>';
  if(miss){
    h+=fline()+fnode('done','Missed','<p class="muted">No damage.</p>'+(mast.indexOf('Graze')>-1?'<div class="note"><b>Graze:</b> '+esc(MASTERY.Graze)+'</div>':''));
    h+=fline()+fnode('active','Finish',F.n<M.perAction?'<button class="btn pri big" data-a="fl-next">Next attack ('+(F.n+1)+' of '+M.perAction+')</button>':'<button class="btn big" data-a="close">Done</button>');
    return h+'</div>';
  }
  var d2='';
  if(hit){
    if(M.savage&&dmgParse(a.dmg).d)d2+=savageHtml();
    d2+='<button class="btn pri big" data-a="fl-dmg">'+(F.dmg?'Roll damage again':'Roll damage')+'</button>'+damageResultHtml(a);
  }else d2='<p class="muted">'+esc(a.dmg)+(F.out===null?'':'')+'</p>';
  h+=fline()+fnode(!hit?'locked':(F.dmg?'done':'active'),'Damage',d2);
  if(M.riders.length){
    var rb='';
    M.riders.forEach(function(r){

function entrySheet(){
