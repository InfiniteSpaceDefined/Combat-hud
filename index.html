<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Combat HUD</title>
<meta name="theme-color" content="#10151a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#e9ece8" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Combat HUD">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/barlow-condensed-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/barlow-condensed-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/barlow-condensed-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/instrument-sans-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/instrument-sans-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/instrument-sans-latin-600-normal.woff2') format('woff2')}
:root{
  --bg:#e9ece8; --panel:#f7f8f5; --panel2:#ecefea; --line:#cdd3cc;
  --ink:#1a2026; --mute:#5d6870; --accent:#1d7766; --accent-ink:#fff;
  --act:#1d7766; --bon:#a67c1f; --rea:#4c5bb0; --hp:#b8403a;
  --disp:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151a; --panel:#181f26; --panel2:#212a33; --line:#2f3a45;
    --ink:#e6e8e3; --mute:#94a0aa; --accent:#5cbfa8; --accent-ink:#0d1a17;
    --act:#5cbfa8; --bon:#d2a94d; --rea:#8e9cf0; --hp:#e0645d;
  }
}
:root[data-theme="dark"]{
  --bg:#10151a; --panel:#181f26; --panel2:#212a33; --line:#2f3a45;
  --ink:#e6e8e3; --mute:#94a0aa; --accent:#5cbfa8; --accent-ink:#0d1a17;
  --act:#5cbfa8; --bon:#d2a94d; --rea:#8e9cf0; --hp:#e0645d;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
input[type=number],input[type=text]{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
:focus-visible{outline:2px solid var(--accent-text,var(--accent));outline-offset:2px}
.muted{color:var(--mute);font-size:.92rem}

.app{max-width:1200px;margin:0 auto;padding:12px 12px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.top h1{font:700 clamp(1.9rem,5vw,2.6rem)/1 var(--disp)}
.top p{color:var(--mute);font-size:.95rem}
.icon{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:1.3rem;line-height:1}
.layout{display:grid;gap:14px}
.layout.empty{grid-template-columns:1fr!important;max-width:640px;margin:0 auto}
.layout.empty .side{display:none}
.welcome ol{padding-left:20px;margin:6px 0 16px}
.welcome li{margin:6px 0}
.turnbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px}
.crow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.crow .btn{margin-top:8px}
.row.act-on{border-color:var(--accent-text,var(--accent))}
@media (min-width:740px){
  .layout{grid-template-columns:minmax(300px,350px) minmax(0,1fr);align-items:start}
  .side{position:sticky;top:12px}
}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.side{display:flex;flex-direction:column;gap:10px}
.hpbig{display:flex;align-items:baseline;gap:6px}
.hpbig b{font:700 clamp(3rem,10vw,3.6rem)/1 var(--disp)}
.hpbig .of{font:500 1.8rem var(--disp);color:var(--mute)}
.hpbig .tmpv{margin-left:auto;font-size:.9rem;color:var(--mute)}
.bar{height:10px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:8px 0 10px}
.bar i{display:block;height:100%;background:var(--hp);transition:width .2s}
.hpctl{display:grid;grid-template-columns:1fr auto auto;gap:8px}
.hpctl input{width:100%;text-align:center;font-size:1.1rem}
.death{display:flex;gap:14px;align-items:center;margin-top:10px;flex-wrap:wrap;font-size:.9rem}
.pip{width:26px;height:26px;border-radius:50%;border:2px solid var(--mute);background:transparent;padding:0}
.pip.on.s{background:var(--accent);border-color:var(--accent)}
.pip.on.f{background:var(--hp);border-color:var(--hp)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tile .lbl{font-size:.8rem;color:var(--mute)}
.tile .v{font:700 clamp(1.5rem,5.5vw,2.1rem)/1 var(--disp);white-space:nowrap}
.trks{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.trk{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.trk .lbl{font-size:.82rem;color:var(--mute);display:block;margin-bottom:4px}
.cnt{display:flex;align-items:center;gap:8px}
.tv{display:flex;align-items:baseline;gap:6px;margin-bottom:6px}
.tv b{font:700 2.1rem/1 var(--disp)}
.tv .of{font:500 1.1rem var(--disp);color:var(--mute)}
.tb{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tb .step-b{width:100%}
.cnt b{font:700 2rem/1 var(--disp);min-width:1.1ch;text-align:center}
.cnt .of{font:500 1.1rem var(--disp);color:var(--mute)}
.step-b{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:600;font-size:1.2rem;padding:0}
.rests{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.insp{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 6px;font-weight:600;min-height:46px}
.insp[aria-pressed=true]{background:var(--bon);border-color:var(--bon);color:#111}

.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 14px;font-weight:600;min-height:46px}
.btn:hover{border-color:var(--accent-text,var(--accent))}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dmg{background:var(--hp);border-color:var(--hp);color:var(--hp-ink,#fff)}
.btn.big{width:100%;min-height:54px;font-size:1.05rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sel{border-color:var(--accent-text,var(--accent));box-shadow:inset 0 0 0 2px var(--accent-text,var(--accent))}

.tabs:empty{display:none}
.layout>*{min-width:0}
.tabs{max-width:100%}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{border:0;background:transparent;border-radius:9px;padding:11px 8px;font-weight:600;min-height:46px}
.tabs button[aria-selected=true]{background:var(--panel);box-shadow:0 0 0 1px var(--line)}

.grp{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.grp.act{border-left-color:var(--act)} .grp.bon{border-left-color:var(--bon)} .grp.rea{border-left-color:var(--rea)}
.gh{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:transparent;border:0;padding:14px;text-align:left;min-height:60px}
.gh .t{font:600 1.45rem/1.1 var(--disp);letter-spacing:.01em}
.grp.act .t{color:var(--act)} .grp.bon .t{color:var(--bon)} .grp.rea .t{color:var(--rea)}
.gh .s{display:block;color:var(--mute);font-size:.88rem;margin-top:2px}
.gh .chev{font-size:1.2rem;color:var(--mute);transition:transform .15s}
.gh[aria-expanded=true] .chev{transform:rotate(180deg)}
.gb{padding:0 10px 10px}
.row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px;text-align:left;min-height:62px}
.row:hover{border-color:var(--accent-text,var(--accent))}
.row .rn{font-weight:600;display:block}
.row small{display:block;color:var(--mute);font-size:.86rem;font-weight:400;margin-top:1px}
.row .rv{font:700 1.9rem/1 var(--disp);white-space:nowrap}
.row .rt{font-size:.82rem;color:var(--mute);white-space:nowrap;text-align:right}
.row.std{background:transparent}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.82rem;background:var(--panel2);margin:0 6px 6px 0}
.chip.bonus{border-color:var(--bon)} .chip.reaction{border-color:var(--rea)} .chip.action{border-color:var(--act)}

.list{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;width:100%;background:transparent;border:0;border-top:1px solid var(--line);padding:10px 2px;text-align:left;min-height:48px}
.lrow:first-child{border-top:0}
.lrow .b{font:700 1.3rem/1 var(--disp)}
.lrow .ab{color:var(--mute);font-size:.8rem;margin-left:6px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--mute);display:inline-block}
.dot.p1{background:var(--bon);border-color:var(--bon)}
.dot.p2{background:var(--bon);border-color:var(--bon);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--bon)}
.abg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.abt{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.abt .nm{font-weight:600}
.abt .md{font:700 2rem/1 var(--disp)}
.abt .sc{color:var(--mute);font-size:.85rem}
.abt button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px;min-height:44px;text-align:left;display:flex;align-items:center;gap:8px;justify-content:space-between}
h2.sec{font:600 1.35rem/1.1 var(--disp);margin:6px 0 10px}
.pre{white-space:pre-wrap;color:var(--mute);font-size:.92rem}
details.f{border-top:1px solid var(--line);padding:10px 0}
details.f:first-of-type{border-top:0}
details.f summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.f p{color:var(--mute);font-size:.92rem;margin-top:6px}
details.f .opt{margin:8px 0 0 10px;padding-left:10px;border-left:3px solid var(--line)}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.ov[hidden]{display:none}
.sheet{background:var(--panel);width:100%;max-width:620px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);position:relative}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:18px;max-height:88%}}
.sheet h2{font:700 1.8rem/1.1 var(--disp);padding-right:48px;margin-bottom:4px}
.sheet h3{font:600 1.2rem/1.1 var(--disp);margin:16px 0 8px}
.x{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:1.3rem;line-height:1}
.sheet p{margin-top:6px}
.sheet .stepbox{border-top:1px solid var(--line);margin-top:14px;padding-top:2px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:6px 0 10px}
.seg button{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:10px 4px;min-height:44px;font-weight:600;font-size:.92rem}
.seg button[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.res{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.res .n{font:700 2.8rem/1 var(--disp)}
.res .d{color:var(--mute);font-size:.92rem;flex:1 1 160px}
.res em{display:block;font-style:normal;font-weight:600;color:var(--accent-text,var(--accent))}
.res em.bad{color:var(--hp)}
.two3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.note{background:color-mix(in srgb,var(--bon) 16%,transparent);border-left:4px solid var(--bon);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:.92rem}
.check{display:flex;gap:10px;align-items:center;margin:8px 0;min-height:44px}
.check input{width:22px;height:22px}
.list-d li{margin:4px 0}

.seg.two{grid-template-columns:1fr 1fr;margin:10px 0 4px}
.flow{margin-top:10px}
.fnode{border:2px solid var(--line);background:var(--panel2);border-radius:14px;padding:10px 12px}
.fnode .fh{font:600 1.15rem/1.1 var(--disp);letter-spacing:.01em;margin-bottom:8px}
.fnode.active{border-color:var(--accent-text,var(--accent))}
.fnode.done{border-color:var(--accent-text,var(--accent));background:color-mix(in srgb,var(--accent) 10%,var(--panel2))}
.fnode.done .fh::before{content:'\2713\00a0';color:var(--accent-text,var(--accent))}
.fnode.opt{border-style:dashed}
.fnode.locked{opacity:.5}
.fnode .res{margin:8px 0}
.fnode .check{margin:4px 0}
.fnode .seg{margin:0 0 8px}
.fnode .row{background:var(--panel)}
.fline{width:2px;height:20px;background:var(--line);margin:0 auto;position:relative}
.fline::after{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top:8px solid var(--line);border-bottom:0}
.fq{text-align:center;font-weight:600;margin:0 0 8px}
.fbranch{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;padding-top:16px}
.fbranch::before{content:'';position:absolute;top:0;left:16.6%;right:16.6%;height:16px;border:2px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0}
.fchoice{min-height:54px;border:2px solid var(--line);border-radius:12px;background:var(--panel2);font-weight:600;padding:6px}
.fchoice.dim{opacity:.55}
.fchoice.chosen{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fchoice.miss.chosen{background:var(--hp);border-color:var(--hp);color:var(--hp-ink,#fff)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 0}
.rollchip{border:2px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center;background:var(--panel2)}
.rollchip .t{display:block;font-size:.8rem;color:var(--mute)}
.rollchip b{display:block;font:700 2.2rem/1.05 var(--disp)}
.rollchip small{color:var(--mute)}
.rollchip.used{border-color:var(--accent-text,var(--accent));background:color-mix(in srgb,var(--accent) 14%,var(--panel2))}
.rollchip.used .t{color:var(--accent-text,var(--accent));font-weight:600}
.rollchip.unused{border-style:dashed;opacity:.65}
.rollchip.unused b{text-decoration:line-through}
.tabs{grid-template-columns:repeat(4,1fr)!important}
.sumg{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.sumi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.sumi b{display:block;font:700 1.7rem/1 var(--disp)}
.sumi span{font-size:.8rem;color:var(--mute)}
.lgbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.lgturn{font:600 1.15rem/1.1 var(--disp);margin:14px 0 4px}
.lgturn:first-child{margin-top:0}
.lgrow{display:grid;grid-template-columns:3.4em 1fr;gap:8px;padding:8px 0 8px 10px;border-top:1px solid var(--line);border-left:4px solid var(--line)}
.lgturn+.lgrow{border-top:0}
.lgrow .lt{color:var(--mute);font-size:.82rem;padding-top:2px}
.lgrow .lb{font-weight:600}
.lgrow .lb small{display:block;color:var(--mute);font-weight:400;font-size:.88rem;margin-top:1px}
.lgrow.attack{border-left-color:var(--act)}
.lgrow.hp.damage{border-left-color:var(--hp)}
.lgrow.hp.heal{border-left-color:var(--accent)}
.lgrow.feature{border-left-color:var(--bon)}
.lgrow.check{border-left-color:var(--rea)}
.card details,details.f.card{background:var(--panel)}
.tabs{grid-auto-flow:column;grid-auto-columns:1fr!important;grid-template-columns:none!important}
.tabs button{padding:11px 2px;font-size:.92rem}
.conc{display:flex;align-items:center;justify-content:space-between;gap:10px;background:color-mix(in srgb,var(--rea) 16%,var(--panel));border:1px solid var(--rea);border-radius:12px;padding:10px 12px}
.conc.check{background:color-mix(in srgb,var(--hp) 14%,var(--panel));border-color:var(--hp)}
.conc.fx{background:color-mix(in srgb,var(--bon) 16%,var(--panel));border-color:var(--bon)}
.conc .cbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.conc .btn{min-height:40px;padding:6px 12px}
.slots .srow{display:grid;grid-template-columns:2.4em 1fr auto;gap:10px;align-items:center;padding:4px 0}
.slots .sl{font-weight:600}
.slots .pips{display:flex;gap:8px;flex-wrap:wrap}
.spip{width:30px;height:30px;border-radius:50%;border:2px solid var(--rea);background:transparent;padding:0}
.spip.on{background:var(--rea)}
.scl{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:baseline;padding:4px 0;border-top:1px solid var(--line)}
.scl:first-of-type{border-top:0}
.sq{width:100%;margin-bottom:10px}
.chips2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip2{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 12px;min-height:38px;font-size:.9rem}
.chip2[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.sprow{display:grid;grid-template-columns:44px 1fr;gap:6px;align-items:center;border-top:1px solid var(--line)}
.lgturn+.sprow{border-top:0}
.star{width:44px;height:48px;border:0;background:transparent;font-size:1.4rem;color:var(--mute);padding:0}
.star[aria-pressed=true]{color:var(--bon)}
.spbtn{text-align:left;background:transparent;border:0;padding:8px 4px;min-height:48px}
.spbtn .sn{font-weight:600}
.spbtn small{display:block;color:var(--mute);font-size:.86rem}
.tg{font-style:normal;font-size:.72rem;border:1px solid var(--line);border-radius:6px;padding:0 5px;color:var(--mute);margin-left:4px}
.fbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:.9rem;margin:8px 0 2px}
.dl dt{font-weight:600}
.dl dd{margin:0;color:var(--mute)}
.tabs{display:flex!important;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;gap:4px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto!important;min-width:78px;padding:11px 12px!important;scroll-snap-align:center}
.grow{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline}
.grow:first-of-type{border-top:0}
.grow .gn{font-weight:500}
.grow .gq{font-weight:600;min-width:2.4em;text-align:right}
.grow .gw{color:var(--mute);font-size:.88rem;min-width:4.2em;text-align:right}
.lgrow.spell{border-left-color:var(--rea)}
.prow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line)}
.prow .btn{min-height:40px;padding:6px 10px}
.prow .pr{font:700 1.4rem/1 var(--disp);min-width:2.2em}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:30;max-width:92%;text-align:center}
.toast[hidden]{display:none}
.imp{position:relative;overflow:hidden;display:block;width:100%;text-align:center;cursor:pointer}
.imp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;padding:0;border:0}
@media (prefers-reduced-motion:reduce){.bar i,.gh .chev{transition:none}}
/* ===== sleek layer: flowchart-only UI, refined look ===== */
:root{--bg:#f2f4f2;--panel:#ffffff;--panel2:#eff1ee;--line:#e2e5e1;--ink:#12171b;--mute:#5f6a74;--accent:#0f7f6b;--accent-ink:#ffffff;--act:#0f7f6b;--bon:#b45309;--rea:#5b3fe0;--hp:#d62839;--hp-ink:#ffffff;--heal:#17803f;--heal-ink:#ffffff;--r:16px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0f13;--panel:#131a20;--panel2:#1a232b;--line:#243039;--ink:#e8ebe7;--mute:#8996a1;--accent:#4fd0b3;--accent-ink:#06140f;--act:#4fd0b3;--bon:#ffc233;--rea:#a78bfa;--hp:#ff5a6a;--hp-ink:#2a0509;--heal:#4ade80;--heal-ink:#052e16}}
:root[data-theme="dark"]{--bg:#0b0f13;--panel:#131a20;--panel2:#1a232b;--line:#243039;--ink:#e8ebe7;--mute:#8996a1;--accent:#4fd0b3;--accent-ink:#06140f;--act:#4fd0b3;--bon:#ffc233;--rea:#a78bfa;--hp:#ff5a6a;--hp-ink:#2a0509;--heal:#4ade80;--heal-ink:#052e16}
html{background:radial-gradient(900px 420px at 50% -80px,color-mix(in srgb,var(--accent) 9%,transparent),transparent),var(--bg)}
body{background:transparent;font-size:15.5px;letter-spacing:.005em}
.app{padding:14px 14px 56px}
.layout{gap:16px}
.muted{font-size:.88rem}
/* header */
.who{display:flex;align-items:center;gap:12px;min-width:0}
.mono{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;font:700 1.2rem/1 var(--disp);letter-spacing:.03em;color:var(--accent-ink);background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 45%,var(--rea)))}
.mono:empty{display:none}
.top{margin-bottom:16px}
.top h1{font:700 clamp(1.45rem,4.6vw,2rem)/1.05 var(--disp);letter-spacing:.01em}
.top p{font-size:.82rem}
.icon{width:42px;height:42px;border-radius:50%;background:var(--panel);border:1px solid var(--line);color:var(--mute)}
/* surfaces */
.card{border-radius:var(--r);padding:14px 16px;border:1px solid var(--line);background:var(--panel)}
input[type=number],input[type=text]{border:1px solid transparent;border-radius:12px;padding:10px 12px;background:var(--panel2)}
input[type=number]:focus,input[type=text]:focus{outline:0;border-color:var(--accent-text,var(--accent));background:var(--panel)}
.sq{margin-bottom:10px}
/* buttons */
.btn{border:0;border-radius:12px;min-height:44px;padding:10px 16px;font-weight:600;background:var(--panel2);transition:transform .08s,background .15s}
.btn:hover{border:0;background:color-mix(in srgb,var(--accent) 10%,var(--panel2))}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:color-mix(in srgb,var(--accent) 88%,#fff)}
.btn.dmg{background:var(--hp);color:var(--hp-ink,#fff)}
.btn.dmg:hover{background:color-mix(in srgb,var(--hp) 90%,#000)}
.btn.sel{background:color-mix(in srgb,var(--accent) 14%,var(--panel2));box-shadow:inset 0 0 0 2px var(--accent-text,var(--accent))}
.btn.big{min-height:52px;border-radius:14px}
.btn[disabled]{opacity:.38}
/* status */
.side{gap:12px}
.hpbig b{font:700 clamp(3.2rem,11vw,3.8rem)/.95 var(--disp);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hpbig .of{font:500 1.6rem var(--disp)}
.bar{height:6px;border:0;border-radius:99px;margin:10px 0 12px;background:var(--panel2)}
.bar i{border-radius:99px;background:linear-gradient(90deg,var(--hp),color-mix(in srgb,var(--hp) 65%,#ff9d6b))}
.tiles{gap:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tile{background:transparent;border:0;border-left:1px solid var(--line);border-radius:0;padding:10px 14px}
.tile:first-child{border-left:0}
button.tile:hover{background:var(--panel2)}
.tile .v{font-variant-numeric:tabular-nums}
.trks{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.trk{display:grid;grid-template-columns:1fr auto;grid-template-areas:"l b" "v b";align-items:center;gap:0 8px;border-radius:14px;padding:10px 12px;background:var(--panel)}
.trk .lbl{grid-area:l;font-size:.76rem;margin:0}
.trk .tv{grid-area:v;margin:0}
.trk .tv b{font-variant-numeric:tabular-nums}
.trk .tb{grid-area:b;display:flex;gap:6px}
.step-b{width:34px;height:34px;border-radius:50%;background:var(--panel2);border:0;font-size:1.1rem}
.tb .step-b{width:34px}
.step-b:hover{background:color-mix(in srgb,var(--accent) 14%,var(--panel2))}
.slots{padding:12px 16px}
.spip{width:24px;height:24px}
.rests{gap:8px}
.insp{border:0;background:var(--panel2);border-radius:12px;min-height:44px;color:var(--mute)}
.insp[aria-pressed=true]{background:var(--bon);color:#111}
.pip{width:26px;height:26px}
.conc{border-radius:14px}
/* tabs: underline style */
.tabs{background:transparent!important;border:0!important;border-bottom:1px solid var(--line)!important;border-radius:0!important;padding:0!important;gap:2px!important;margin-bottom:14px}
.tabs button{border-radius:0!important;background:transparent!important;box-shadow:none!important;color:var(--mute);font-weight:600;min-height:44px;position:relative;padding:11px 14px!important}
.tabs button[aria-selected=true]{color:var(--ink)}
.tabs button[aria-selected=true]::after{content:'';position:absolute;left:12px;right:12px;bottom:-1px;height:2.5px;border-radius:2px;background:var(--accent-text,var(--accent))}
.turnbar{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:2px 2px 12px;margin-bottom:8px}
.turnbar .btn{min-height:36px;padding:6px 14px}
/* action groups */
.grp{background:transparent;border:0;border-radius:0;margin-bottom:4px;overflow:visible}
.gh{justify-content:flex-start;gap:12px;padding:12px 2px;min-height:54px;border-bottom:1px solid var(--line)}
.gh::before{content:'';width:4px;align-self:stretch;border-radius:3px;background:var(--line);flex:none}
.grp.act .gh::before{background:var(--act)}
.grp.bon .gh::before{background:var(--bon)}
.grp.rea .gh::before{background:var(--rea)}
.gh>span:first-of-type{flex:1;min-width:0}
.gh .t{font:600 1.28rem/1.1 var(--disp);letter-spacing:.01em}
.gh .s{font-size:.82rem}
.gb{padding:2px 0 10px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:60px;margin-top:8px;transition:transform .08s,border-color .15s}
.row:active{transform:scale(.99)}
.row:hover{border-color:color-mix(in srgb,var(--accent-text,var(--accent)) 55%,var(--line))}
.row .rv{color:var(--accent-text,var(--accent));font-variant-numeric:tabular-nums}
.row.std{background:transparent}
.row.act-on{border-color:var(--accent-text,var(--accent))}
.chip{border:0;border-radius:999px;font-size:.76rem;padding:3px 10px;background:var(--panel2)}
.chip.bonus{background:color-mix(in srgb,var(--bon) 20%,var(--panel2))}
.chip.reaction{background:color-mix(in srgb,var(--rea) 20%,var(--panel2))}
.chip.action{background:color-mix(in srgb,var(--act) 20%,var(--panel2))}
.chip2{border:0;background:var(--panel2)}
/* sheet */
.ov{background:color-mix(in srgb,#000 55%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet{border:0;border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px 16px calc(28px + env(safe-area-inset-bottom,0px));animation:sheetUp .22s ease-out;background:var(--panel)}
.sheet::before{content:'';display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-8px auto 14px}
@keyframes sheetUp{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
@media (min-width:700px){.sheet{border:1px solid var(--line);border-radius:22px}.sheet::before{display:none}}
.x{top:14px;right:14px;width:38px;height:38px;border-radius:50%;background:var(--panel2);border:0;color:var(--mute)}
.sheet h2{font:700 1.65rem/1.05 var(--disp);letter-spacing:.01em}
.sheet h3{font-size:1.1rem}
/* flowchart */
.flow{margin-top:14px}
.fnode{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;transition:border-color .2s,background .2s,opacity .2s}
.fnode .fh{font:600 1.05rem/1.1 var(--disp);letter-spacing:.015em;margin-bottom:8px}
.fnode.active{border-color:color-mix(in srgb,var(--accent-text,var(--accent)) 65%,var(--line));background:color-mix(in srgb,var(--accent) 5%,var(--panel));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
.fnode.done{background:color-mix(in srgb,var(--accent) 7%,var(--panel));border-color:color-mix(in srgb,var(--accent-text,var(--accent)) 32%,var(--line))}
.fnode.done .fh::before{content:'\2713\00a0';color:var(--accent-text,var(--accent))}
.fnode.opt{border-style:dashed;background:transparent}
.fnode.locked{opacity:.42}
.fnode .row{background:var(--panel2);border-color:transparent}
.fline{width:1.5px;height:18px;background:var(--line)}
.fline::after{border-top-color:var(--line)}
.fq{font-size:.9rem;color:var(--mute);font-weight:600;margin-bottom:8px}
.fbranch::before{border-color:var(--line);border-width:1.5px}
.fchoice{border:1px solid var(--line);border-radius:14px;background:var(--panel2);min-height:52px}
.fchoice.chosen{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fchoice.miss.chosen{background:var(--hp);border-color:var(--hp);color:var(--hp-ink,#fff)}
.seg{background:var(--panel2);border-radius:12px;padding:3px;gap:2px;margin:6px 0 10px}
.seg button{border:0;background:transparent;border-radius:10px;min-height:40px;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14);border:0}
.res{background:var(--panel2);border:0;border-radius:14px}
.res .n{font:700 2.6rem/1 var(--disp);font-variant-numeric:tabular-nums}
.note{border-radius:12px;background:color-mix(in srgb,var(--bon) 12%,var(--panel2));border-left:3px solid var(--bon)}
.rollchip{border-radius:14px;background:var(--panel2);border:1.5px solid transparent}
.rollchip.used{border-color:var(--accent-text,var(--accent));background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
.rollchip.unused{border:1.5px dashed var(--line)}
/* lists and cards inside tabs */
.lgrow{border-left-width:3px}
.sumi{background:var(--panel2);border:0;border-radius:12px}
.abt{background:var(--panel2);border:0;border-radius:14px}
.abt button{background:var(--panel);border:0;border-radius:10px}
details.f{border-top-color:var(--line)}
@media (min-width:740px){.layout{grid-template-columns:minmax(300px,340px) minmax(0,1fr)}.app{padding-top:22px}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.btn,.row,.fnode{transition:none}}
/* polish */
.trk{grid-template-columns:minmax(0,1fr) auto;min-width:0}
.trk .lbl{overflow-wrap:anywhere;line-height:1.2}
.trks{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.tile{padding:10px 12px;min-width:0}
.tile .lbl{white-space:nowrap}
.rests .btn,.rests .insp{padding:10px 6px;font-size:.9rem;white-space:nowrap}

.trk{grid-template-areas:"l l" "v b";row-gap:2px}
.trk .lbl{overflow-wrap:break-word}
.prompt{position:sticky;top:0;z-index:7;background:var(--panel);border:1.5px solid var(--accent-text,var(--accent));border-radius:16px;padding:12px 14px;margin:0 0 12px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.prompt p{margin:2px 0 6px}
.pgrp{margin:8px 0}
.plabel{font-weight:600;font-size:.92rem}
.plabel small{color:var(--mute);font-weight:400}
.pin{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pin input{flex:1 1 72px;min-width:64px;text-align:center;font-size:1.25rem;font-weight:700}
.pin input.bad{border-color:var(--hp)}
.dpillrow{display:flex;justify-content:flex-end;margin:-6px 46px 6px 0}
.dpill{border:0;border-radius:999px;background:var(--panel2);color:var(--mute);font-size:.78rem;font-weight:600;padding:4px 12px;min-height:30px}
.dpill[aria-pressed=true]{background:color-mix(in srgb,var(--bon) 26%,var(--panel2));color:var(--ink)}
.x{z-index:9}
.verline{margin-top:18px;text-align:center}
.fsec>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;min-height:44px}
.fsec>summary::-webkit-details-marker{display:none}
.fsec>summary h2{margin:0}
.fsec>summary .cnt{background:var(--panel2);border-radius:999px;padding:2px 10px;font-size:.82rem;color:var(--mute);font-weight:600;margin-left:auto}
.fsec>summary::after{content:'\25be';color:var(--mute);margin-left:4px;transition:transform .15s}
.fsec[open]>summary::after{transform:rotate(180deg)}
details.ft{border-top:1px solid var(--line);padding:0}
details.ft>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px 10px;min-height:50px;cursor:pointer;flex-wrap:wrap;padding:8px 0;font:600 1rem var(--body)}
details.ft>summary::-webkit-details-marker{display:none}
details.ft .fnm{font-weight:600}
details.ft .ftags{display:flex;flex-wrap:wrap;gap:4px}
details.ft .ftags .chip{margin:0}
details.ft .fbody{padding:0 0 12px}
details.ft .fbody p{color:var(--ink);font-size:.93rem;margin:0 0 8px}
details.ft .fopts{margin:6px 0 8px;padding-left:18px;font-size:.9rem;color:var(--mute)}
details.ft .fopts b{color:var(--ink)}
details.ft .fbody p.fsrc{color:var(--mute);font-size:.78rem}
.fminor{color:var(--mute);font-size:.88rem;margin:6px 0 8px}
.fminor b{color:var(--ink)}
.fhid{margin-top:10px;font-size:.84rem}

<body>
<div class="app">
  <header class="top">
    <div class="who"><span class="mono" id="mono" aria-hidden="true"></span><div><h1 id="who"></h1><p id="what"></p></div></div>
    <button class="icon" id="menuBtn" aria-label="Menu and import">&#8943;</button>
  </header>
  <div class="layout">
    <aside class="side" id="side" aria-label="Status"></aside>
    <section>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="view"></div>
    </section>
  </div>
</div>
<div class="ov" id="ov" hidden>
  <div class="sheet" role="dialog" aria-modal="true" id="sheet"><button class="x" data-a="close" aria-label="Close">&times;</button><div id="sb"></div></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ---------- D&D Beyond PDF field parser (pure, no DOM) ---------- */
var DB_ABIL=['str','dex','con','int','wis','cha'];
var DB_ABF={str:['STR','STRmod','ST Strength','StrProf'],dex:['DEX','DEXmod','ST Dexterity','DexProf'],con:['CON','CONmod','ST Constitution','ConProf'],int:['INT','INTmod','ST Intelligence','IntProf'],wis:['WIS','WISmod','ST Wisdom','WisProf'],cha:['CHA','CHamod','ST Charisma','ChaProf']};
var DB_SKILLS=[['Acrobatics','Acrobatics','AcrobaticsProf','dex'],['Animal Handling','Animal','AnimalHandlingProf','wis'],['Arcana','Arcana','ArcanaProf','int'],['Athletics','Athletics','AthleticsProf','str'],['Deception','Deception','DeceptionProf','cha'],['History','History','HistoryProf','int'],['Insight','Insight','InsightProf','wis'],['Intimidation','Intimidation','IntimidationProf','cha'],['Investigation','Investigation','InvestigationProf','int'],['Medicine','Medicine','MedicineProf','wis'],['Nature','Nature','NatureProf','int'],['Perception','Perception','PerceptionProf','wis'],['Performance','Performance','PerformanceProf','cha'],['Persuasion','Persuasion','PersuasionProf','cha'],['Religion','Religion','ReligionProf','int'],['Sleight of Hand','SleightofHand','SleightOfHandProf','dex'],['Stealth','Stealth','StealthProf','dex'],['Survival','Survival','SurvivalProf','wis']];

function dbKey(k){return String(k).replace(/\s+/g,' ').trim()}
function dbMap(raw){
  var m={};
  Object.keys(raw).forEach(function(k){
    if(k==='__order')return;
    var nk=dbKey(k),v=raw[k]==null?'':String(raw[k]);
    if(!(nk in m)||(!m[nk]&&v))m[nk]=v;
  });
  return m;
}
function dbInt(v){
  var n=parseInt(String(v==null?'':v).replace(/\u2212/g,'-').replace(/[^\d+-]/g,''),10);
  return isNaN(n)?null:n;
}
function dbTokens(s){return String(s).toLowerCase().replace(/[^a-z0-9 ]+/g,' ').split(/\s+/).filter(Boolean)}
function dbSubset(a,b){return a.length>0&&a.every(function(t){return b.indexOf(t)>-1})}
function dbSlug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function dbAct(s){
  s=String(s||'').toLowerCase();
  if(/bonus action/.test(s))return 'bonus';
  if(/reaction/.test(s))return 'reaction';
  if(/1 action|^action/.test(s))return 'action';
  if(/special/.test(s))return 'special';
  return '';
}

/* Parse the long "Features & Traits" text into structured features */
function parseFeatureText(text){
  var lines=String(text||'').split(/\r?\n/).map(function(s){return s.replace(/\s+$/,'')});
  var feats=[],byName={},sub='';
  var section='',cur=null,target=null,prevBlank=true,prevText=false;
  function addText(t){
    if(!target)return;
    if(!target.paras)target.paras=[];
    if(prevText&&!prevBlank&&target.paras.length)target.paras[target.paras.length-1]+=' '+t;
    else target.paras.push(t);
  }
  lines.forEach(function(raw){
    var line=raw.replace(/^\s+/,'');
    var m;
    if(!line){prevBlank=true;return}
    if((m=line.match(/^===\s*(.+?)\s*===$/))){section=m[1];cur=null;target=null;prevBlank=true;prevText=false;return}
    if((m=line.match(/^\*\s*(.+?)\s*(?:\u2022\s*(.*))?$/))){
      var nm=m[1].replace(/^\d+:\s*/,'').trim();
      var f=byName[nm.toLowerCase()];
      if(!f){f={name:nm,source:(m[2]||'').trim(),section:section,paras:[],activation:'',uses:null,options:[],acts:[]};byName[nm.toLowerCase()]=f;feats.push(f)}
      cur=f;target=f;prevBlank=false;prevText=false;return;
    }
    if(line.charAt(0)==='|'){
      var body=line.replace(/^\|\s*/,'');
      prevBlank=false;prevText=false;
      /* usage: [Name:] N / Short|Long|Other [Rest] [• activation] */
      if((m=body.match(/^(?:(.+?):\s*)?(\d+)\s*\/\s*(Short|Long|Other)(?:\s+or\s+(?:Short|Long))?(?:\s+Rest)?\s*(?:\u2022\s*(.*))?$/i))&&cur){
        var uname=(m[1]||cur.name).trim(),uact=dbAct(m[4]);
        var u={max:parseInt(m[2],10),rest:m[3].toLowerCase(),name:uname,activation:uact};
        cur.usages=cur.usages||[];cur.usages.push(u);
        if(!cur.uses)cur.uses={max:u.max,rest:u.rest,name:u.name};
        if(!m[1]||uname.toLowerCase()===cur.name.toLowerCase()){if(uact)cur.activation=uact}
        else if(uact==='bonus'||uact==='reaction')cur.acts.push({label:uname,activation:uact});
        return;
      }
      /* bare activation: | 1 Bonus Action */
      if((m=body.match(/^(1 Action|1 Bonus Action|1 Reaction|Special|No Action)\s*$/i))&&cur){
        cur.activation=dbAct(m[1])||cur.activation;return;
      }
      /* option header: Name • */
      if((m=body.match(/^(.+?)\s*\u2022\s*$/))&&cur){
        var o={name:m[1].trim(),paras:[],activation:''};
        cur.options.push(o);target=o;return;
      }
      /* activation tag: Something: 1 Action | 1 Bonus Action | 1 Reaction | (empty) */
      if((m=body.match(/^(.+?):\s*(1 Action|1 Bonus Action|1 Reaction|Special|No Action)?\s*$/i))&&cur){
        var tag=m[1].trim(),act=dbAct(m[2]);
        var tt=dbTokens(tag.replace(/^Maneuver:\s*/i,'')),hit=null;
        cur.options.forEach(function(o){if(!hit&&dbSubset(tt,dbTokens(o.name))&&dbSubset(dbTokens(o.name),tt))hit=o});
        if(!hit)cur.options.forEach(function(o){if(!hit){var ot=dbTokens(o.name.replace(/\(.*\)/,''));if(dbSubset(ot,tt))hit=o}});
        if(hit){if(act&&!hit.activation)hit.activation=act;return}
        var parts=tag.split(/:\s*/),last=parts[parts.length-1];
        var label=(last.toLowerCase()===cur.name.toLowerCase())?cur.name:tag;
        if(act)cur.acts.push({label:label,activation:act});
        return;
      }
      if(/^Special$/i.test(body)&&cur){cur.activation=cur.activation||'special';return}
      if(cur&&/subclass/i.test(cur.name)){cur.subName=body.trim();if(!sub)sub=body.trim();return}
      return;
    }
    addText(line);prevBlank=false;prevText=true;
  });
  feats.forEach(function(f){
    f.text=f.paras.join('\n');
    f.options.forEach(function(o){o.text=(o.paras||[]).join('\n')});
  });
  return {features:feats,sub:sub};
}

function parseSpells(m,order){
  var cls=(m['spellCastingClass0']||'').split(/\s*\/\s*/).filter(Boolean);
  if(!cls.length&&!m['spellName0'])return null;
  var ab=(m['spellCastingAbility0']||'').split(/\s*\/\s*/),dc=(m['spellSaveDC0']||'').split(/\s*\/\s*/),at=(m['spellAtkBonus0']||'').split(/\s*\/\s*/);
  var classes=cls.map(function(c,i){return {cls:c,ability:ab[i]||ab[0]||'',dc:dbInt(dc[i]!=null?dc[i]:dc[0]),atk:dbInt(at[i]!=null?at[i]:at[0])}});
  var seq=[];
  if(order&&order.length){order.forEach(function(n){var k=dbKey(n);if(/^spell(Header|Name)\d+$/.test(k))seq.push(k)})}
  else{
    var hs=[],ns=[];
    Object.keys(m).forEach(function(k){if(/^spellHeader\d+$/.test(k)&&m[k])hs.push(k);else if(/^spellName\d+$/.test(k)&&m[k])ns.push(k)});
    ns.sort(function(a,b){return +a.slice(9)-+b.slice(9)});seq=hs.concat(ns);
  }
  var level=0,slots={},list=[],seen={};
  seq.forEach(function(k){
    var mm=k.match(/^spell(Header|Name)(\d+)$/);
    if(mm[1]==='Header'){
      var h=m[k]||'',lm=h.match(/(\d+)(?:st|nd|rd|th)\s+LEVEL/i);
      level=/CANTRIP/i.test(h)?0:(lm?+lm[1]:level);
      var sm=(m['spellSlotHeader'+mm[2]]||'').match(/(\d+)\s+Slots?/i);
      if(sm&&level>0)slots[level]=+sm[1];
      return;
    }
    var i=mm[2],raw=(m['spellName'+i]||'').trim();if(!raw)return;
    var s={name:raw.replace(/\s*\[R\]\s*$/,''),ritual:/\[R\]/.test(raw),level:level,prep:(m['spellPrepared'+i]||'').trim(),source:(m['spellSource'+i]||'').trim(),saveHit:(m['spellSaveHit'+i]||'').trim(),time:(m['spellCastingTime'+i]||'').trim(),range:(m['spellRange'+i]||'').trim(),comp:(m['spellComponents'+i]||'').trim(),dur:(m['spellDuration'+i]||'').trim(),page:(m['spellPage'+i]||'').trim(),notes:(m['spellNotes'+i]||'').trim()};
    s.always=s.prep==='P'||/Always Prepared/i.test(s.source);
    s.conc=/Concentration/i.test(s.dur);
    var fm=s.notes.match(/(\d+)\/LR/);s.free=fm?+fm[1]:0;
    s.srcs=[s.source.replace(/\s*\(Always Prepared\)/i,'').trim()];
    s.id=dbSlug(s.name)+'-'+level;
    var key=level+'|'+s.name.toLowerCase(),prev=seen[key];
    if(prev){
      s.srcs.forEach(function(x){if(x&&prev.srcs.indexOf(x)<0)prev.srcs.push(x)});
      if(s.always)prev.always=true;
      if(s.free&&!prev.free)prev.free=s.free;
      if(/2024/.test(s.page)&&!/2024/.test(prev.page)){
        ['time','range','comp','dur','page','notes','saveHit','conc','ritual'].forEach(function(f){prev[f]=s[f]});
      }
      return;
    }
    seen[key]=s;list.push(s);
  });
  return {classes:classes,slots:slots,list:list};
}

function parseDBFields(raw){
  var order=raw&&raw.__order;
  var m=dbMap(raw);
  var cl=m['CLASS LEVEL']||'';
  if(!cl&&!m['STR'])throw new Error('This does not look like a D&D Beyond character sheet PDF.');
  var ch={v:1};
  ch.name=m['CharacterName']||'Character';
  ch.player=m['PLAYER NAME']||'';
  ch.classText=cl;
  var nums=(cl.match(/\d+/g)||[]).map(Number);
  ch.level=nums.length?nums.reduce(function(a,b){return a+b},0):1;
  ch.cls=cl.replace(/\s*\d+/g,'').replace(/\s*\/\s*/g,' / ').trim();
  ch.species=m['RACE']||'';
  ch.background=m['BACKGROUND']||'';
  ch.alignment=m['ALIGNMENT']||'';
  ch.profBonus=dbInt(m['ProfBonus']);
  if(ch.profBonus==null)ch.profBonus=Math.ceil(ch.level/4)+1;
  ch.abilities={};
  DB_ABIL.forEach(function(k){
    var f=DB_ABF[k],score=dbInt(m[f[0]]);if(score==null)score=10;
    var mod=dbInt(m[f[1]]);if(mod==null)mod=Math.floor((score-10)/2);
    var prof=!!(m[f[3]]||'').trim();
    var sv=dbInt(m[f[2]]);if(sv==null)sv=mod+(prof?ch.profBonus:0);
    ch.abilities[k]={score:score,mod:mod,save:sv,saveProf:prof};
  });
  ch.skills=DB_SKILLS.map(function(s){
    var mod=ch.abilities[s[3]].mod,b=dbInt(m[s[1]]),p=(m[s[2]]||'').trim();
    var prof=p?(/^e/i.test(p)?2:1):0;
    if(b==null)b=mod+prof*ch.profBonus;
    return {name:s[0],ab:s[3],bonus:b,prof:prof};
  });
  [1,2,3].forEach(function(i){
    var n=(m['CustomSkill'+i]||'').trim();if(!n)return;
    var b=dbInt(m['Custom Skill Bonus '+i]),p=(m['CustomProf'+i]||'').trim();
    ch.skills.push({name:n,ab:'',bonus:b==null?0:b,prof:p?(/^e/i.test(p)?2:1):0});
  });
  ch.passive={perception:dbInt(m['Passive1']),insight:dbInt(m['Passive2']),investigation:dbInt(m['Passive3'])};
  ch.ac=dbInt(m['AC'])||10;
  ch.init=dbInt(m['Init'])||0;
  ch.speed=(m['Speed']||'30 ft.').replace(/\s*\(Walking\)/i,'');
  ch.hpMax=dbInt(m['MaxHP'])||1;
  ch.hpCur=dbInt(m['CurrentHP']);
  ch.hitDice=m['Total']||'';
  ch.inspiration=!!(m['Inspiration']&&!/^(off|false|no|0)$/i.test(m['Inspiration']));
  ch.proficiencies=(m['ProficienciesLang']||'').replace(/===\s*(.+?)\s*===/g,'$1:').replace(/[ \t]+\n/g,'\n').trim();
  ch.defenses=(m['Defenses']||'').trim();
  ch.senses=(m['AdditionalSenses']||'').trim();
  ch.attacks=[];
  for(var i=1;i<=8;i++){
    var nm=m[i===1?'Wpn Name':'Wpn Name '+i];
    if(!nm||!nm.trim())continue;
    ch.attacks.push({
      name:nm.trim(),
      bonus:dbInt(m['Wpn'+i+' AtkBonus']),
      dmg:(m['Wpn'+i+' Damage']||'').trim(),
      notes:(m['Wpn Notes '+i]||'').trim()
    });
  }
  var seen={};
  ch.attacks=ch.attacks.filter(function(a){
    var k=[a.name,a.bonus,a.dmg,a.notes].join('|');
    if(seen[k]){seen[k].qty++;return false}
    a.qty=1;seen[k]=a;return true;
  });
  var ft=[];
  for(var n=1;n<=12;n++){var v=m['FeaturesTraits'+n];if(v==null)break;ft.push(v)}
  /* personal details, story, gear, hit dice, save notes */
  var xp=m['EXPERIENCE POINTS']||m['EXPERIENCE POINTS2']||m['EXPERIENCE POINTS3']||'';
  ch.details={gender:m['GENDER']||'',age:m['AGE']||'',size:m['SIZE']||'',height:m['HEIGHT']||'',weight:m['WEIGHT']||'',faith:m['FAITH']||'',skin:m['SKIN']||'',eyes:m['EYES']||'',hair:m['HAIR']||'',xp:xp};
  var notes=[];for(var ni=1;ni<=6;ni++){var nv=(m['AdditionalNotes'+ni]||'').trim();if(nv)notes.push(nv)}
  ch.story={traits:(m['PersonalityTraits']||'').trim(),ideals:(m['Ideals']||'').trim(),bonds:(m['Bonds']||'').trim(),flaws:(m['Flaws']||'').trim(),appearance:(m['Appearance']||'').trim(),allies:(m['AlliesOrganizations']||'').trim(),backstory:(m['Backstory']||'').trim(),notes:notes.join('\n\n')};
  var items=[];
  for(var ei=0;ei<80;ei++){var en=(m['Eq Name'+ei]||'').trim();if(en)items.push({name:en,qty:(m['Eq Qty'+ei]||'1').trim(),weight:(m['Eq Weight'+ei]||'').trim().replace(/^--$/,'')})}
  var att=[];
  for(var ai=0;ai<=10;ai++){var an=(m['Attuned Name'+ai]||'').trim();if(an)att.push({name:an,qty:(m['Attuned Qty'+ai]||'1').trim(),weight:(m['Attuned Weight'+ai]||m['AttunedWeight'+ai]||'').trim().replace(/^--$/,'')})}
  ch.gear={coins:{cp:m['CP']||'0',sp:m['SP']||'0',ep:m['EP']||'0',gp:m['GP']||'0',pp:m['PP']||'0'},carried:m['Weight Carried']||'',encumbered:m['Encumbered']||'',push:m['PushDragLift']||'',items:items,attuned:att};
  ch.saveNotes=(m['SaveModifiers']||'').trim();
  ch.hitDiceList=[];
  var hdre=/(\d+)\s*d\s*(\d+)/gi,hm;
  while((hm=hdre.exec(ch.hitDice||'')))ch.hitDiceList.push({n:+hm[1],die:+hm[2]});
  ch.spells=parseSpells(m,order);
  var pf=parseFeatureText(ft.join('\n'));
  ch.features=pf.features;
  ch.sub=pf.sub;
  return ch;
}

</script>
<script>
(function(){
'use strict';
var KEY='combat-hud-v2';
var APP_VERSION='0.6';
var PDFJS='lib/pdf.min.js';
var PDFJS_WORKER='lib/pdf.worker.min.js';

var MASTERY={
 Cleave:'On a hit, make another attack against a second creature within 5 ft of the first. Don\u2019t add your ability modifier to that damage. Once per turn.',
 Graze:'On a miss, you still deal damage equal to your ability modifier.',
 Nick:'The extra Light weapon attack is part of the Attack action. Once per turn.',
 Push:'On a hit, push a Large or smaller target up to 10 ft straight away.',
 Sap:'On a hit, the target has disadvantage on its next attack roll before the start of your next turn.',
 Slow:'On a hit that deals damage, reduce the target\u2019s Speed by 10 ft until the start of your next turn (doesn\u2019t stack).',
 Topple:'On a hit, the target makes a Con save or falls prone.',
 Vex:'On a hit that deals damage, you have advantage on your next attack roll against that target before the end of your next turn.'
};
var STD=[
 ['Dash','Gain extra movement equal to your Speed for this turn.'],
 ['Disengage','Your movement doesn\u2019t provoke opportunity attacks for the rest of the turn.'],
 ['Dodge','Until your next turn, attack rolls against you have disadvantage (if you can see the attacker) and you have advantage on Dex saves. It ends if you\u2019re incapacitated or your Speed is 0.'],
 ['Help','Give an ally advantage on their next check for a task, or on their next attack against a creature within 5 ft of you.'],
 ['Hide','Make a Dex (Stealth) check against DC 15 while out of sight or heavily obscured. On a success you\u2019re hidden.'],
 ['Influence','Make a Cha (Deception, Intimidation, Performance, Persuasion) or Wis (Animal Handling) check to sway a creature.'],
 ['Ready','Choose a trigger you can perceive and a response. When it happens, use your Reaction to do it.'],
 ['Search','Make a Wis check (Insight, Medicine, Perception or Survival) to find something.'],
 ['Study','Make an Int check (Arcana, History, Investigation, Nature or Religion) to recall or analyse.'],
 ['Utilize','Use a non-magical object that needs an action.']
];

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s)}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function sgn(n){n=n||0;return (n<0?'\u2212':'+')+Math.abs(n)}
function d(n){return Math.floor(Math.random()*n)+1}
function rolls(n,s){var r=[];for(var i=0;i<n;i++)r.push(d(s));return r}
function sum(a){return a.reduce(function(x,y){return x+y},0)}
function paras(t){return String(t||'').split('\n').filter(Boolean).map(function(p){return '<p>'+esc(p)+'</p>'}).join('')}
function clone(o){return JSON.parse(JSON.stringify(o))}
function dmgParse(s){
  var m=String(s||'').match(/^\s*(?:(\d+)\s*d\s*(\d+))?\s*(?:([+-])?\s*(\d+))?\s*(.*)$/i)||[];
  var n=m[1]?+m[1]:0,dd=m[2]?+m[2]:0,mod=0;
  if(m[4]){mod=+m[4];if(m[3]==='-')mod=-mod}
  return {n:n,d:dd,mod:mod,type:(m[5]||'').trim().toLowerCase()};
}
function diceExpr(s){
  var m=String(s).match(/(\d+)\s*d\s*(\d+)\s*(?:([+-])\s*(\d+))?/i);if(!m)return null;
  var mod=m[4]?+m[4]:0;if(m[3]==='-')mod=-mod;
  return {n:+m[1],d:+m[2],mod:mod};
}

/* ---------- model derived from imported features ---------- */
function usagesOf(f){return f.usages&&f.usages.length?f.usages:(f.uses?[f.uses]:[])}
function tkName(f,u){
  var n=u.name;
  if(u.rest==='other'&&n.indexOf(': ')>0)return n.split(': ')[0];
  if(n.indexOf(f.name+': ')===0)return n.slice(f.name.length+2);
  return n;
}

  list.forEach(function(e){
    if(e.turn!==turn){turn=e.turn;h+='<div class="lgturn">Turn '+turn+'</div>'}
    var l=logLine(e);
    h+='<div class="lgrow '+l.cls+'"><span class="lt">'+logTime(e.t)+'</span><span class="lb">'+esc(l.main)+(l.sub.length?'<small>'+l.sub.map(esc).join(' \u00b7 ')+'</small>':'')+'</span></div>';
  });

}
function logText(list,title){
  var lines=[title],turn=null;

    if(e.turn!==turn){turn=e.turn;lines.push('Turn '+turn)}

function dealtText(){var dl=summarize(LG().entries,LG().turn).dealt;return dl?' \u00b7 '+dl+' dealt':''}
function endCombat(){

  L.past.unshift({start:L.entries[0].t,end:Date.now(),turns:L.turn,entries:L.entries,summary:summarize(L.entries,L.turn)});
  L.past=L.past.slice(0,10);L.entries=[];L.turn=1;S.play.once={};save();return true;
}
function renderLog(){

   +'<div class="card" style="margin-top:12px">'+entriesHtml(L.entries)+'</div>';

      h+='<details class="f card" style="margin-bottom:10px"><summary>'+esc(when)+' \u00b7 '+c.summary.turns+' turn'+(c.summary.turns>1?'s':'')+' \u00b7 '+c.summary.dealt+' dealt, '+c.summary.taken+' taken</summary>'+sumGrid(c.summary)
       +entriesHtml(c.entries)
       +'<button class="btn'+(LGARM==='p'+i?' dmg':'')+'" data-a="lg-delpast" data-i="'+i+'" style="margin-top:10px">'+(LGARM==='p'+i?'Tap again to delete':'Delete this combat')+'</button></details>';
    });

function rollDamage(done){
  var a=S.char.attacks[F.ai],p=dmgParse(a.dmg),crit=F.out==='crit';
  var nd=p.n*(crit?2:1),groups=p.d?[{label:'Damage dice',n:nd,x:p.d}]:[];
  if(F.savage&&p.d){groups[0].label='First roll';groups.push({label:'Second roll (Savage Attacker)',n:nd,x:p.d})}
  ask('Roll '+nd+'d'+p.d+(crit?' for the critical hit':'')+' ('+aName(a)+')',groups,function(arr){
    var r1=p.d?arr[0]:[],r2=null,use=r1,idx=0;
    if(F.savage&&p.d){r2=arr[1];if(sum(r2)>sum(r1)){use=r2;idx=1}}
    F.dmg={p:p,a:r1,b:r2,used:use,usedIdx:idx,sum:sum(use),crit:crit};
    if(F.savage&&p.d){S.play.once['savage-attacker']=true;F.savageUsed=true;save()}
    else if(F.savageUsed){delete S.play.once['savage-attacker'];F.savageUsed=false;save()}
    done();
  });
}

/* ---------- flowchart view ---------- */
function fnode(state,title,body){
  body=body||'';
  if(state==='locked')body=body.replace(/<button /g,'<button disabled ');
  return '<div class="fnode '+state+'"><div class="fh">'+title+'</div>'+(body?'<div class="fb">'+body+'</div>':'')+'</div>';
}
function fline(){return '<div class="fline" aria-hidden="true"></div>'}
function rollPairHtml(){
  var d=F.dmg;if(!d||!d.b)return '';
  function chip(arr,i){
    var used=d.usedIdx===i;
    return '<div class="rollchip '+(used?'used':'unused')+'"><span class="t">Roll '+(i+1)+' \u00b7 '+(used?'used':'not used')+'</span><b>'+sum(arr)+'</b><small>'+(arr.length>1?arr.join(' + '):'d'+d.p.d)+'</small></div>';
  }
  return '<div class="pair" aria-label="Savage Attacker: both rolls">'+chip(d.a,0)+chip(d.b,1)+'</div>';
}
function damageResultHtml(a){
  if(!F.dmg)return '';
  var parts=[];
  parts.push('d'+(F.dmg.p.d||'')+' ('+F.dmg.used.join(', ')+')');
  if(F.dmg.p.mod)parts.push(sgn(F.dmg.p.mod));
  if(F.pre)parts.push(esc(F.pre.name)+' '+F.pre.value);
  if(F.add)parts.push(esc(F.add.name)+' die '+F.add.value);
  var rp=F.riders.map(function(r){return esc(r.name)+' ('+r.rolls.join(', ')+')'});
  if(!F.dmg.p.d)parts=[String(F.dmg.p.mod)].concat(F.add?[esc(F.add.name)+' die '+F.add.value]:[]);
  parts=parts.concat(rp);
  return rollPairHtml()+'<div class="res"><span class="n">'+dmgTotal()+'</span><span class="d">'+parts.join(' ')+'<em>'+esc(F.dmg.p.type||'damage')+'</em></span></div>';
}
function attackFlow(a,mast){
  var hit=F.out==='hit'||F.out==='crit',miss=F.out==='miss',h='<div class="flow">';
  var b1=advSeg()+'<button class="btn pri big" data-a="fl-roll">Roll d20 '+sgn(a.bonus)+'</button>';
  if(F.roll){
    var tot=F.roll.used+a.bonus,nat=F.roll.used;
    b1+='<div class="res"><span class="n">'+tot+'</span><span class="d">'+esc(d20Text(F.roll,a.bonus))+(nat===20?'<em>Natural 20: critical hit</em>':nat===1?'<em class="bad">Natural 1: miss</em>':'')+'</span></div>';
  }
  h+=fnode(F.out?'done':'active','Roll to hit',b1)+fline();
  h+='<div class="fq">Does it hit?</div><div class="fbranch">'
   +[['miss','Miss'],['hit','Hit'],['crit','Critical hit']].map(function(o){
      return '<button class="fchoice '+o[0]+(F.out===o[0]?' chosen':(F.out?' dim':''))+'" data-a="fl-out" data-v="'+o[0]+'">'+o[1]+'</button>';
    }).join('')+'</div>';
  if(miss){
    h+=fline()+fnode('done','Missed','<p class="muted">No damage.</p>'+(mast.indexOf('Graze')>-1?'<div class="note"><b>Graze:</b> '+esc(MASTERY.Graze)+'</div>':''));
    h+=fline()+fnode('active','Finish',F.n<M.perAction?'<button class="btn pri big" data-a="fl-next">Next attack ('+(F.n+1)+' of '+M.perAction+')</button>':'<button class="btn big" data-a="close">Done</button>');
    return h+'</div>';
  }
  var d2='';
  if(hit){
    if(M.savage&&dmgParse(a.dmg).d)d2+=savageHtml();
    d2+='<button class="btn pri big" data-a="fl-dmg">'+(F.dmg?'Roll damage again':'Roll damage')+'</button>'+damageResultHtml(a);
  }else d2='<p class="muted">'+esc(a.dmg)+(F.out===null?'':'')+'</p>';
  h+=fline()+fnode(!hit?'locked':(F.dmg?'done':'active'),'Damage',d2);
  if(M.riders.length){
    var rb='';
    M.riders.forEach(function(r){
      var inF=F.riders.filter(function(x){return x.id===r.id})[0];
      var okw=r.spellOnly?isSpellAtk(a):(!r.needsFinesse||/Finesse|Range|Ammunition/i.test(a.notes||''));
      var used=r.once!==false&&S.play.once[r.id]&&!inF;
      if(inF)rb+='<div class="res"><span class="n">+'+inF.value+'</span><span class="d"><b>'+esc(r.name)+'</b> '+inF.rolls.join(', ')+'</span></div><button class="btn" data-a="fl-unrider" data-id="'+r.id+'">Remove '+esc(r.name)+'</button>';
      else rb+='<button class="btn big" style="margin-top:6px" data-a="fl-rider" data-id="'+r.id+'"'+((used||!okw)?' disabled':'')+'>'+esc(r.name)+' \u00b7 add '+r.dice+(used?' (used this turn)':!okw?(r.spellOnly?' (spell attacks only)':' (needs a finesse or ranged weapon)'):'')+'</button>';
      rb+='<details class="f"><summary>Rules</summary>'+paras(r.text)+'</details>';
    });
    h+=fline()+fnode(!hit?'locked':(F.riders.length?'done':'opt'),'Extra damage (optional)',rb);
  }
  if(M.addons.length){
    var mb='<p class="muted">'+left(M.sdId)+' superiority dice left (d'+M.dieSize+')</p>';
    if(F.pre&&M.onlyOne)mb+='<div class="note">'+esc(F.pre.name)+' is already your maneuver for this attack (one maneuver per attack), so you can\u2019t add another to it.</div>';
    M.addons.forEach(function(o){
      var dis=(F.pre&&M.onlyOne)||(F.add&&(M.onlyOne||F.add.id===o.id))||left(M.sdId)<=0;
      mb+='<button class="btn big" style="margin-top:6px" data-a="fl-add" data-id="'+o.id+'"'+(dis?' disabled':'')+'>'+esc(o.name)+' \u00b7 spend a d'+M.dieSize+'</button>';
    });
    if(F.add)mb+='<div class="res"><span class="n">+'+F.add.value+'</span><span class="d"><b>'+esc(F.add.name)+'</b><br>'+esc(F.add.text)+(F.add.save&&M.maneuverDC?'<em>'+esc(F.add.save)+' save, DC '+M.maneuverDC+'</em>':'')+'</span></div><button class="btn" data-a="fl-unadd">Undo and refund the die</button>';
    h+=fline()+fnode(!hit?'locked':(F.add?'done':'opt'),'Maneuver (optional)',mb);
  }
  var eff=mast.filter(function(w){return w!=='Graze'});
  if(eff.length)h+=fline()+fnode(!hit?'locked':'active','On a hit',eff.map(function(w){return '<div class="note"><b>'+w+':</b> '+esc(MASTERY[w])+'</div>'}).join(''));
  h+=fline()+fnode(F.out?'active':'locked','Finish',F.n<M.perAction?'<button class="btn pri big" data-a="fl-next">Next attack ('+(F.n+1)+' of '+M.perAction+')</button>':'<button class="btn big" data-a="close">Done</button>');
  return h+'</div>';
}

function attackSheet(){
  var a=S.char.attacks[F.ai],mast=masteryOf(a);
  var h='<h2>'+esc(aName(a))+'</h2><p class="muted">'+(M.perAction>1?'Attack '+F.n+' of '+M.perAction+' \u00b7 ':'')+sgn(a.bonus)+' to hit \u00b7 '+esc(a.dmg)+'</p>';
  if(F.pre)h+='<div class="note">'+esc(F.pre.name)+': add '+F.pre.value+' to the damage if this hits.</div>';
  F.notes.forEach(function(n){h+='<div class="note">'+esc(n)+'</div>'});

/* ---------- entry (bonus / reaction / other) ---------- */
function openEntry(id){
  var all=M.bonus.concat(M.reaction,M.other),e=null;
  all.forEach(function(x){if(x.id===id)e=x});
  if(!e)return;

  ADV=0;openSheet('entry');
}
function weaponList(e,pre){
  var h='';
  S.char.attacks.forEach(function(a,i){
    if(e.melee&&/Ammunition/i.test(a.notes||''))return;
    h+='<button class="row" data-a="ent-atk" data-i="'+i+'"><span class="rn">'+esc(aName(a))+'<small>'+esc(a.dmg)+'</small></span><span class="rv">'+sgn(a.bonus)+'</span></button>';
  });

}
function stdChoices(e){
  var r=[];
  if(e.activation==='bonus')STD.forEach(function(x,i){if(['Dash','Disengage','Hide','Dodge','Help'].indexOf(x[0])>-1&&new RegExp('\\b'+x[0]+'\\b').test(e.text))r.push({i:i,name:x[0]})});

function renderBlocks(B,choices){
  var h='<div class="flow">';

  if(choices&&choices.length)h+=(B.length?fline():'')+'<div class="fq">Choose one</div><div class="fbranch">'+choices.map(function(c){return '<button class="fchoice" data-a="std" data-i="'+c.i+'">'+c.name+'</button>'}).join('')+'</div>';
  return h+'</div>';
}
function rollNote(e,total){
  if(e.give)return e.temp?'Each creature gains '+(total*2)+' temporary hit points (twice the roll).':'Give this die to the creature. They roll it and add it when they use it.';
  return 'Add it to your check';
}
function entryBlocks(e,t){
  var B=[],dieT=M.sdId?trk(M.sdId):null;
  function add(state,title,body,st){B.push({state:state,title:title,body:body,st:st})}

    add(E.slotDone?'done':'active','Create a level '+lv+' spell slot',E.slotDone?'<div class="note">Created. Level '+lv+' slots: '+slotLeft(lv)+' of '+mx+'. Sorcery Points left: '+left(M.spId)+'.</div>':'<button class="btn pri big" data-a="ent-slot"'+(can?'':' disabled')+'>Spend '+cost+' Sorcery Points</button>'+(!cost?'<p class="muted">I couldn\u2019t read the cost. Check your sheet.</p>':sp<cost?'<p class="muted">Not enough Sorcery Points ('+sp+' left).</p>':have>=mx?'<p class="muted">All your level '+lv+' slots are already available.</p>':''),'');
  }else if(e.heal){
    add(E.heal?'done':'active','Use '+esc(e.name),E.heal?'<p class="muted">Rolled '+esc(e.heal)+'</p>':'<button class="btn pri big" data-a="ent-heal"'+(nouse?' disabled':'')+'>Use '+esc(e.name)+' and roll '+esc(e.heal)+'</button>'+(nouse?noUse:''),'');
    add(!E.heal?'locked':(E.applied?'done':'active'),'Regain hit points',E.heal?'<div class="res"><span class="n">+'+E.heal.total+'</span><span class="d">'+esc(e.heal)+' rolled '+E.heal.rolls.join(', ')+(E.heal.mod?' '+sgn(E.heal.mod):'')+'<em>HP to regain</em></span></div><button class="btn pri big" data-a="ent-apply"'+(E.applied?' disabled':'')+'>'+(E.applied?'Healing applied':'Apply '+E.heal.total+' HP')+'</button>':'<p class="muted">Roll first.</p>',undefined);
  }else if(e.usesDie){
    var nodie=left(M.sdId)<=0;
    add(E.die!=null?'done':'active','Spend a superiority die',(E.die!=null?'<div class="res"><span class="n">'+E.die+'</span><span class="d">Superiority die rolled<em>Add it to the damage if the attack hits</em></span></div>':'<p class="muted">'+(dieT?left(dieT.id)+' left':'')+'</p><button class="btn pri big" data-a="ent-die"'+(nodie?' disabled':'')+'>Spend a d'+M.dieSize+'</button>'+(nodie?'<p class="muted">No superiority dice left.</p>':'')),'');
    if(e.attackAfter)add(E.die==null?'locked':'active','Attack',(e.adv?'<p class="muted">This attack has advantage.</p>':'')+weaponList(e),'Now attack');
  }else if(e.give&&e.trk&&t){
    add(E.spent?'done':'active','Use '+esc(e.name),E.spent?'<p class="muted">Used. '+left(t.id)+' left.</p>':'<button class="btn pri big" data-a="ent-use"'+(nouse?' disabled':'')+'>Use '+esc(e.name)+'</button>'+(nouse?noUse:''),'');
    add(!E.spent?'locked':(E.roll?'done':'active'),'Roll '+esc(e.roll),E.roll?'<div class="res"><span class="n">'+E.roll.total+'</span><span class="d">Rolled '+E.roll.rolls.join(', ')+'<em>'+esc(rollNote(e,E.roll.total))+'</em></span></div>':'<p class="muted">Optional. Roll it now, or let the creature roll it when they use it.</p><button class="btn big" data-a="ent-roll">Roll '+esc(e.roll)+'</button>',undefined);
  }else if(e.roll){
    add(E.roll?'done':'active','Roll '+esc(e.roll),E.roll?'<div class="res"><span class="n">'+E.roll.total+'</span><span class="d">'+esc(e.roll)+' rolled '+E.roll.rolls.join(', ')+'<em>'+esc(rollNote(e,E.roll.total))+'</em></span></div>':'','');
    if(!E.roll)B[B.length-1].body='<button class="btn pri big" data-a="ent-roll">Roll '+esc(e.roll)+'</button>';
    else B[B.length-1].body='<button class="btn big" data-a="ent-roll">Roll again</button>'+B[B.length-1].body;
  }else if(e.trk&&t){
    add(E.spent?'done':'active','Use '+esc(e.name),E.spent?'<div class="note">Used. '+left(t.id)+' left.</div>':'<button class="btn pri big" data-a="ent-use"'+(nouse?' disabled':'')+'>'+(e.effect?'Use and activate ':'Use ')+esc(e.name)+'</button>'+(nouse?noUse:''),'');
    if(e.regainSP&&M.spId)add(!E.spent?'locked':(E.regained?'done':'active'),'Regain Sorcery Points',E.regained?'<div class="note">Regained. Sorcery Points: '+left(M.spId)+' of '+trk(M.spId).max+'.</div>':'<button class="btn pri big" data-a="ent-regain">Regain up to '+e.regainSP+' Sorcery Points</button>',undefined);
    if(/additional action|extra action/i.test(e.text))add(E.spent?'active':'locked','Attack with',weaponList({melee:false}),undefined);
  }else if(e.attackAfter){

  }else if(!stdChoices(e).length&&!e.effect){

  }

  }

  });
  return B;
}
function entrySheet(){

/* ---------- spells, slots, concentration, effects ---------- */
var SP=null;
var AB_NAME={STR:'Strength',DEX:'Dexterity',CON:'Constitution',INT:'Intelligence',WIS:'Wisdom',CHA:'Charisma'};
function spellsOf(){return (S&&S.char.spells&&S.char.spells.list)||[]}
function hasSpells(){return spellsOf().length>0}
function spellById(id){var l=spellsOf();for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return null}
function ordinal(n){return n===1?'1st':n===2?'2nd':n===3?'3rd':n+'th'}
function spellStats(s){
  var cl=(S.char.spells&&S.char.spells.classes)||[],hit=null;
  cl.forEach(function(c){(s.srcs||[]).forEach(function(src){if(!hit&&src&&c.cls&&src.toLowerCase().indexOf(c.cls.toLowerCase())>-1)hit=c})});
  return hit||cl[0]||{cls:'',ability:'',dc:null,atk:null};
}
function fxBonus(){
  var dc=0,adv=false,names=[];
  Object.keys((S&&S.play.effects)||{}).forEach(function(id){
    if(S.play.effects[id]&&M.effects[id]){dc+=M.effects[id].dc||0;if(M.effects[id].adv)adv=true;names.push(M.effects[id].name)}
  });
  return {dc:dc,adv:adv,names:names};
}
function stype(s){var t=s.time||'';if(/^1BA/.test(t))return 'bonus';if(/^1R/.test(t))return 'reaction';if(/^1A/.test(t))return 'action';return 'other'}
function timeLabel(t){
  t=t||'';
  if(t==='1A')return 'Action';if(t==='1BA')return 'Bonus action';if(t==='1R')return 'Reaction';
  var m=t.match(/^(\d+)m$/);if(m)return m[1]+' minute'+(m[1]==='1'?'':'s');
  if(/^1A\s*\+\s*(\d+)m/.test(t))return 'Action (ritual: +'+t.match(/(\d+)m/)[1]+' min)';
  return t||'';
}
function isPrepared(s){return s.always||!!S.play.fav[s.id]}
function slotMax(l){var sl=S.char.spells&&S.char.spells.slots;return(sl&&sl[l])||0}
function slotLeft(l){var v=S.play.slots[l];return v==null?slotMax(l):v}
function slotLevels(){return Object.keys((S.char.spells&&S.char.spells.slots)||{}).map(Number).sort(function(a,b){return a-b})}
function resetSlots(){var sl=(S.char.spells&&S.char.spells.slots)||{};S.play.slots={};Object.keys(sl).forEach(function(l){S.play.slots[l]=sl[l]})}
function slotRows(){
  var lv=slotLevels();if(!lv.length)return '';
  var h='<div class="card slots"><span class="muted">Spell slots</span>';

function spellDef(s){return SPELL_DMG[String(s.name).toLowerCase()]||null}
function parseDice(d){var m=String(d).match(/^\s*(\d+)\s*d\s*(\d+)\s*(?:\+\s*(\d+))?\s*$/i);return m?{n:+m[1],x:+m[2],k:m[3]?+m[3]:0}:null}
function diceStr(o){return o.n+'d'+o.x+(o.k?'+'+o.k:'')}
function castLevel(){return(SP&&typeof SP.lvl==='number'&&SP.lvl>0)?SP.lvl:SP.s.level}
function scalePart(s,part,L){
  var o=parseDice(part.d);if(!o)return part.d;
  if(s.level===0){var lv=S.char.level,tier=lv>=17?4:lv>=11?3:lv>=5?2:1;o.n*=tier;return diceStr(o)}
  var steps=Math.max(0,L-s.level);
  if(part.up&&steps){var u=parseDice(part.up);if(u){o.n+=u.n*steps;o.k+=u.k*steps}else if(!isNaN(+part.up)){o.k+=(+part.up)*steps}}
  return diceStr(o);
}
function spellMod(s){var k=String(spellStats(s).ability||'').toLowerCase().slice(0,3);return S.char.abilities[k]?S.char.abilities[k].mod:0}
function projCount(def){return def.proj.n+def.proj.up*Math.max(0,castLevel()-SP.s.level)}
function projInit(def){var n=projCount(def);if(!SP.dm||!SP.dm.proj||SP.dm.proj.length!==n){SP.dm=SP.dm||{};SP.dm.proj=[];for(var i=0;i<n;i++)SP.dm.proj.push({atk:null,hit:null,dmg:null,rolls:null})}}
function dmgTotalSpell(){
  var d=SP.dm;if(!d)return null;
  if(d.parts)return sum(d.parts.map(function(p){return p.total}));
  if(d.proj){var t=0,any=false;d.proj.forEach(function(r){if(r.dmg!=null){t+=r.dmg;any=true}});return any?t:null}
  if(d.custom)return d.custom.total;
  if(d.heal)return d.heal.total;
  return null;
}
function logSpell(){
  if(!SP||!SP.dm)return;

  if(d.proj)d.proj.forEach(function(r,i){if(r.dmg!=null)parts.push('#'+(i+1)+': '+r.dmg)});
  if(d.custom)parts.push(d.custom.dice+' ('+d.custom.rolls.join(', ')+')');
  if(d.heal){kind='heal';parts.push(d.heal.dice+' ('+d.heal.rolls.join(', ')+')'+(d.heal.mod?' '+sgn(d.heal.mod):'')+(d.heal.temp?' temporary HP':''))}
  SP.dl=SP.dl||{};
  logPlace(SP.dl,'spell',{spell:SP.s.name,level:castLevel(),kind:kind,total:total,parts:parts});
}

  if(def&&def.heal||def&&def.temp){

    if(idx[k]===undefined){idx[k]=out.length;out.push({name:String(it.name).trim(),qty:q,w:w});return}
