   case 'std':
     if(b.dataset.n){SUM={name:'Grapple or shove',text:'Replace one of your attacks with an unarmed strike. The target (no more than one size larger) makes a Str or Dex save against DC '+grappleDC()+'.\nGrapple: on a fail it\u2019s grappled, with Speed 0. You need a free hand.\nShove: on a fail you push it 5 ft away or knock it prone.'}}
     else{var s=STD[i];SUM={name:s[0],text:s[1],roll:s[0]==='Hide'?['Stealth',(S.char.skills.filter(function(x){return x.name==='Stealth'})[0]||{bonus:0}).bonus]:null}}
     openSheet('std');return;
   case 'chk':{
     var ch=S.char;
     if(b.dataset.k==='ab')openRoll(({str:'Strength',dex:'Dexterity',con:'Constitution',int:'Intelligence',wis:'Wisdom',cha:'Charisma'})[b.dataset.t]+' check',ch.abilities[b.dataset.t].mod);
     else if(b.dataset.k==='save')openRoll(b.dataset.t.toUpperCase()+' saving throw',ch.abilities[b.dataset.t].save);
     else{var sk=ch.skills[i];openRoll(sk.name,sk.bonus)}
     return}
   case 'sp-crit':SP.crit=!SP.crit;renderSheet();return;
   case 'sp-dmg':{
     var def0=spellDef(SP.s),L0=castLevel(),pg=[],pm=[];
     def0.p.forEach(function(part){var ds=scalePart(SP.s,part,L0),o=parseDice(ds),mult=(part.atk&&SP.crit)?2:1;pm.push({part:part,ds:ds,o:o,mult:mult});pg.push({label:part.label||'Damage',n:o.n*mult,x:o.x})});
     ask('Roll the damage for '+SP.s.name,pg,function(arr){
       SP.dm={parts:[]};
       pm.forEach(function(q,qi){var r=arr[qi];SP.dm.parts.push({label:q.part.label||'',dice:q.ds+(q.mult>1?' doubled':''),type:q.part.t,half:!!q.part.half,rolls:r,total:sum(r)+q.o.k})});
       logSpell();renderSheet();
     });
     return}
   case 'sp-darts':{
     var df=spellDef(SP.s);projInit(df);var pd=parseDice(df.proj.dmg),dg=[];
     SP.dm.proj.forEach(function(r,k){dg.push({label:'Dart '+(k+1),n:pd.n,x:pd.x})});
     ask('Roll each '+df.proj.label.replace(/s$/,'')+' for '+SP.s.name,dg,function(arr){
       SP.dm.proj.forEach(function(r,k){r.rolls=arr[k];r.dmg=sum(arr[k])+pd.k});
       logSpell();renderSheet();
     });
     return}
   case 'sp-ratk':{
     var df2=spellDef(SP.s);projInit(df2);var ri=i;
     askD20('Ray '+(ri+1)+' attack',function(r){SP.dm.proj[ri].atk=r;if(r.used===1)SP.dm.proj[ri].hit=false;renderSheet()});
     return}
   case 'sp-rhit':{var df3=spellDef(SP.s);projInit(df3);var r3=SP.dm.proj[i];r3.hit=v==='1';if(!r3.hit){r3.dmg=null;r3.rolls=null}logSpell();renderSheet();return}
   case 'sp-rdmg':{
     var df4=spellDef(SP.s);projInit(df4);var pd4=parseDice(df4.proj.dmg),r4=SP.dm.proj[i],m4=(r4.atk&&r4.atk.used===20)?2:1;
     ask('Ray '+(i+1)+' damage'+(m4>1?' (doubled for the critical hit)':''),[{label:'Ray '+(i+1),n:pd4.n*m4,x:pd4.x}],function(arr){
       r4.rolls=arr[0];r4.dmg=sum(arr[0])+pd4.k;logSpell();renderSheet();
     });
     return}
   case 'sp-cust':{
     var inp=$('#sdc'),dv=inp?inp.value.trim():'',oc=parseDice(dv);
     if(!oc){toast('Enter dice like 4d6 or 8d6+2');return}
     SP.custDice=dv;SP.custHalf=!!($('#sdh')&&$('#sdh').checked);
     ask('Roll '+dv+' for '+SP.s.name,[{label:'Damage',n:oc.n,x:oc.x}],function(arr){
       var rc=arr[0];SP.dm={custom:{dice:dv,rolls:rc,total:sum(rc)+oc.k,half:SP.custHalf}};
       logSpell();renderSheet();
     });
     return}
   case 'sp-heal':{
     var dh=spellDef(SP.s),hh=dh.heal||dh.temp,dsh=scalePart(SP.s,{d:hh.d,up:hh.up},castLevel()),oh=parseDice(dsh),modh=hh.mod?spellMod(SP.s):0;
     ask('Roll '+dsh+(dh.temp?' temporary HP':' healing')+' for '+SP.s.name,[{label:dh.temp?'Temporary HP':'Healing',n:oh.n,x:oh.x}],function(arr){
       var rh=arr[0];
       SP.dm={heal:{dice:dsh,rolls:rh,mod:modh,total:Math.max(0,sum(rh)+oh.k+modh),temp:!!dh.temp}};SP.healApplied=false;
       logSpell();renderSheet();
     });
     return}
   case 'sp-apply':{
     var hl2=SP.dm&&SP.dm.heal;
     if(hl2&&!SP.healApplied){
       if(hl2.temp){p.temp=Math.max(p.temp,hl2.total);logAdd('note',{text:SP.s.name+': gained '+hl2.total+' temporary HP'})}
       else applyHp(false,hl2.total,SP.s.name);
       SP.healApplied=true;save();
     }
     renderSheet();return}
   case 'element':if(S){S.element=v==='classic'?'':v;save();applyTheme();renderSheet()}return;
   case 'mode':DB.mode=v;save();applyTheme();renderSheet();return;
   case 'spell':openSpell(id);return;
   case 'star':{var sp1=spellById(id);if(sp1&&!sp1.always)p.fav[id]=!p.fav[id];break}
   case 'sf':p.sf=v;break;
   case 'slot':{var sl0=+b.dataset.l,si0=+b.dataset.i,sc0=slotLeft(sl0);p.slots[sl0]=si0<sc0?si0:si0+1;break}
   case 'sp-cast':{
     var s0=SP.s,cv0=b.dataset.l,lv0=cv0==='r'?'ritual':cv0==='f'?'free':+cv0;
     if(typeof lv0==='number'&&lv0>0){if(slotLeft(lv0)<=0)return;p.slots[lv0]=slotLeft(lv0)-1}
     if(lv0==='free')p.free[s0.id]=(p.free[s0.id]||0)+1;
     SP.cast=true;SP.lvl=lv0;
     if(s0.conc){
       if(p.conc&&p.conc.name!==s0.name)logAdd('note',{text:'Concentration on '+p.conc.name+' ended (cast '+s0.name+')'});
       p.conc={name:s0.name,level:typeof lv0==='number'?lv0:s0.level};p.concCheck=null;
     }
     logAdd('feature',{name:'Cast '+s0.name,detail:(typeof lv0==='number'&&lv0>0?'level '+lv0+' slot, '+slotLeft(lv0)+' left':lv0==='ritual'?'as a ritual':lv0==='free'?'free cast':'cantrip')+(s0.conc?' \u00b7 concentration':'')});
     save();renderSheet();return}
   case 'sp-atk':{
     var at0=SP.s.saveHit.match(/\+\d+|-\d+/),bn0=+at0[0];
     askD20(SP.s.name+' spell attack',function(r){SP.atk=r;if(r.used===20)SP.crit=true;logPlace(SP,'check',{name:SP.s.name+' spell attack',total:r.used+bn0,detail:d20Text(r,bn0)});renderSheet()});
     return}
   case 'sp-flow':openAttack(i,{source:'Cast '+SP.s.name,adv:fxBonus().adv?1:0});return;
   case 'conc-end':if(p.conc){logAdd('note',{text:'Concentration on '+p.conc.name+' ended'});p.conc=null}p.concCheck=null;break;
   case 'conc-keep':logAdd('note',{text:'Concentration held on '+(p.conc?p.conc.name:'the spell')+' (DC '+p.concCheck.dc+')'});p.concCheck=null;break;
   case 'conc-lose':logAdd('note',{text:'Concentration lost on '+(p.conc?p.conc.name:'the spell')});p.conc=null;p.concCheck=null;break;
   case 'conc-roll':{var dc0=p.concCheck.dc;openRoll('Concentration save',S.char.abilities.con.save);R.dc=dc0;renderSheet();return}
   case 'fx-end':delete p.effects[id];logAdd('note',{text:(M.effects[id]?M.effects[id].name:'Effect')+' ended'});break;
   case 'font-conv':{var fl0=+b.dataset.l,tk0=trk(M.spId);if(slotLeft(fl0)>0&&left(M.spId)<tk0.max){p.slots[fl0]=slotLeft(fl0)-1;var gain0=Math.min(fl0,tk0.max-left(M.spId));p.trk[M.spId]=left(M.spId)+gain0;logAdd('feature',{name:'Font of Magic',detail:'converted a level '+fl0+' slot into '+gain0+' Sorcery Points'})}break}
   case 'font-make':{var fm0=+b.dataset.l,cs0=M.spCost[fm0];if(left(M.spId)>=cs0&&slotLeft(fm0)<slotMax(fm0)){p.trk[M.spId]=left(M.spId)-cs0;p.slots[fm0]=slotLeft(fm0)+1;logAdd('feature',{name:'Font of Magic',detail:'spent '+cs0+' Sorcery Points for a level '+fm0+' slot'})}break}
   case 'ent-slot':{var e3=E.e,lv3=e3.slotCreate;if(M.spId&&left(M.spId)>=e3.cost&&slotLeft(lv3)<slotMax(lv3)){p.trk[M.spId]=left(M.spId)-e3.cost;p.slots[lv3]=slotLeft(lv3)+1;E.slotDone=true;logAdd('feature',{name:e3.name,detail:'spent '+e3.cost+' Sorcery Points for a level '+lv3+' slot'})}renderSheet();return}
   case 'ent-regain':{var tk3=trk(M.spId);if(!E.regained&&tk3){var bf3=left(M.spId);p.trk[M.spId]=Math.min(tk3.max,bf3+E.e.regainSP);E.regained=true;logAdd('feature',{name:E.e.name,detail:'regained '+(left(M.spId)-bf3)+' Sorcery Points'})}renderSheet();return}
   case 'dicemode':DB.dice=(v?v:(manual()?'app':'manual'));PROMPT=null;save();renderSheet();return;
   case 'pr-ok':promptOk();return;
   case 'pr-auto':promptAuto();return;
   case 'pr-cancel':PROMPT=null;renderSheet();return;
   case 'adv':ADV=+v;renderSheet();return;
   case 'r-roll':askD20(R.title,function(r){R.res=r;logPlace(R,'check',{name:R.title,total:r.used+R.bonus,detail:d20Text(r,R.bonus)});renderSheet()});return;
   case 'std-roll':R=null;openRoll(SUM.roll[0],SUM.roll[1]);return;
   case 'fl-roll':
     askD20('Roll to hit',function(r){
       F.roll=r;var nat=r.used;
       F.out=nat===20?'crit':nat===1?'miss':null;F.dmg=null;F.add&&unadd();clearRiders();clearSavage();
       renderSheet();
     });return;
   case 'fl-out':F.out=v;if(F.dmg){F.dmg=null}clearRiders();clearSavage();save();renderSheet();return;
   case 'fl-dmg':rollDamage(function(){renderSheet()});return;
   case 'fl-add':{
     var o=M.addons.filter(function(x){return x.id===id})[0];
     if(o&&!(F.pre&&M.onlyOne)&&left(M.sdId)>0){
       ask(o.name+' (superiority die d'+M.dieSize+')',[{label:'Superiority die',n:1,x:M.dieSize}],function(arr){
         if(spend(M.sdId))F.add={id:o.id,name:o.name,text:o.text,save:o.save,value:arr[0][0]};
         renderSheet();
       });
     }else renderSheet();
     return}
   case 'fl-unadd':unadd();renderSheet();return;
   case 'fl-next':{var ai=F.ai,n=F.n+1,adv=ADV;openAttack(ai,{adv:adv});F.n=n;renderSheet();return}
   case 'ent-heal':{
     var ex=diceExpr(E.e.heal);
     ask('Roll '+E.e.heal+' ('+E.e.name+')',[{label:E.e.name,n:ex.n,x:ex.d}],function(arr){
       var r=arr[0];
       if(E.e.trk)spend(E.e.trk);
       E.heal={rolls:r,mod:ex.mod,total:sum(r)+ex.mod};logAdd('feature',{name:E.e.name,detail:'rolled '+E.e.heal+' = '+E.heal.total+' HP to regain'});renderSheet();
     });
     return}
   case 'ent-apply':if(E.heal&&!E.applied){applyHp(false,E.heal.total,E.e.name);E.applied=true;save()}renderSheet();return;
   case 'ent-die':
     if(left(M.sdId)>0){
       ask('Superiority die (d'+M.dieSize+')',[{label:'Superiority die',n:1,x:M.dieSize}],function(arr){
         if(spend(M.sdId)){E.die=arr[0][0];logAdd('feature',{name:E.e.name,detail:'spent a superiority die (d'+M.dieSize+'): '+E.die+', '+left(M.sdId)+' left'})}
         renderSheet();
       });
     }else renderSheet();
     return;
   case 'ent-roll':{
     var x=diceExpr(E.e.roll);
     ask('Roll '+E.e.roll+' ('+E.e.name+')',[{label:E.e.name,n:x.n,x:x.d}],function(arr){
       var rr=arr[0];E.roll={rolls:rr,total:sum(rr)};logAdd('feature',{name:E.e.name,detail:'rolled '+E.e.roll+': '+E.roll.total});renderSheet();
     });
     return}
   case 'ent-use':if(spend(E.e.trk)){E.spent=true;if(E.e.effect){S.play.effects[E.e.effect.id]=true;save()}logAdd('feature',{name:E.e.name,detail:'used, '+left(E.e.trk)+' left'})}renderSheet();return;
   case 'spend':if(spend(id)){toast('Spent 1 '+trk(id).name);logAdd('feature',{name:(E?E.e.name:'Feature'),detail:'spent 1 '+trk(id).name+', '+left(id)+' left'})}renderSheet();return;
   case 'ent-atk':{
     var e2=E.e,ctx={notes:[],adv:e2.adv?1:0,source:e2.name};
     if(E.die!=null)ctx.pre={name:e2.name,value:E.die};
     e2.more.forEach(function(m){ctx.notes.push(m)});
     openAttack(i,ctx);return}
   case 'pick':PICK=false;setActive(id);save();render();return;
   case 'switch':DELARM='';PICK=false;setActive(id);save();closeSheet();return;
   case 'delchar':
     if(DELARM===id){delete DB.chars[id];DELARM='';setActive(DB.active===id?'':DB.active);save();renderSheet()}
     else{DELARM=id;renderSheet()}
     return;
   case 'clearall':
     if(DELARM==='all'){DB.chars={};DB.active='';DELARM='';setActive('');save();renderSheet()}
     else{DELARM='all';renderSheet()}
     return;
   case 'newturn':{var Lg=LG();Lg.turn++;p.once={};toast('Turn '+Lg.turn);break}
   case 'lg-end':if(endCombat())toast('Combat saved to Past combats');LGARM='';break;
   case 'lg-copy':{var txt=logText(LG().entries,S.char.name+' \u00b7 combat log');try{navigator.clipboard.writeText(txt).then(function(){toast('Log copied')},function(){toast('Copy isn\u2019t available here')})}catch(x){toast('Copy isn\u2019t available here')}return}
   case 'lg-clear':if(LGARM==='cur'){LG().entries=[];LG().turn=1;LGARM='';save()}else LGARM='cur';break;
   case 'lg-delpast':if(LGARM==='p'+i){LG().past.splice(i,1);LGARM='';save()}else LGARM='p'+i;break;
   case 'fl-rider':{
     var rd=M.riders.filter(function(x){return x.id===id})[0];
     if(rd){
       var rx=diceExpr(rd.dice),cnt=rx.n*(F.out==='crit'&&!rd.spellOnly?2:1);
       ask(rd.name+' ('+cnt+'d'+rx.d+(F.out==='crit'&&!rd.spellOnly?', doubled for the critical hit':'')+')',[{label:rd.name,n:cnt,x:rx.d}],function(arr){
         var rr2=arr[0];F.riders.push({id:rd.id,name:rd.name,rolls:rr2,value:sum(rr2)});if(rd.once!==false)p.once[rd.id]=true;save();renderSheet();
       });
     }else renderSheet();
     return}
   case 'fl-unrider':{
     F.riders=F.riders.filter(function(x){if(x.id===id){delete p.once[id];return false}return true});
     save();renderSheet();return}
  }
  save();render();
});
function unadd(){if(F.add&&M.sdId){S.play.trk[M.sdId]=Math.min(trk(M.sdId).max,left(M.sdId)+1);save()}F.add=null}
$('#menuBtn').addEventListener('click',function(){openSheet('menu')});
$('#ov').addEventListener('click',function(e){if(e.target.id==='ov')closeSheet()});

render();
if(window.__SHEET_TEST)window.__SHEET_TEST({sp:function(){return SP},pick:function(){return PICK},applyImport:applyImport,state:function(){return S},db:function(){return DB},model:function(){return M},openAttack:openAttack});
})();
</script>
<script>
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
