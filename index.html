/* ---------- spells, slots, concentration, effects ---------- */
var SP=null;
var AB_NAME={STR:'Strength',DEX:'Dexterity',CON:'Constitution',INT:'Intelligence',WIS:'Wisdom',CHA:'Charisma'};
function spellsOf(){return (S&&S.char.spells&&S.char.spells.list)||[]}
function hasSpells(){return spellsOf().length>0}
function spellById(id){var l=spellsOf();for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return null}
function ordinal(n){return n===1?'1st':n===2?'2nd':n===3?'3rd':n+'th'}
function spellStats(s){
  var cl=(S.char.spells&&S.char.spells.classes)||[],hit=null;
  cl.forEach(function(c){(s.srcs||[]).forEach(function(src){if(!hit&&src&&c.cls&&src.toLowerCase().indexOf(c.cls.toLowerCase())>-1)hit=c})});
  return hit||cl[0]||{cls:'',ability:'',dc:null,atk:null};
}
function fxBonus(){
  var dc=0,adv=false,names=[];
  Object.keys((S&&S.play.effects)||{}).forEach(function(id){
    if(S.play.effects[id]&&M.effects[id]){dc+=M.effects[id].dc||0;if(M.effects[id].adv)adv=true;names.push(M.effects[id].name)}
  });
  return {dc:dc,adv:adv,names:names};
}
function stype(s){var t=s.time||'';if(/^1BA/.test(t))return 'bonus';if(/^1R/.test(t))return 'reaction';if(/^1A/.test(t))return 'action';return 'other'}
function timeLabel(t){
  t=t||'';
  if(t==='1A')return 'Action';if(t==='1BA')return 'Bonus action';if(t==='1R')return 'Reaction';
  var m=t.match(/^(\d+)m$/);if(m)return m[1]+' minute'+(m[1]==='1'?'':'s');
  if(/^1A\s*\+\s*(\d+)m/.test(t))return 'Action (ritual: +'+t.match(/(\d+)m/)[1]+' min)';
  return t||'';
}
function isPrepared(s){return s.always||!!S.play.fav[s.id]}
function slotMax(l){var sl=S.char.spells&&S.char.spells.slots;return(sl&&sl[l])||0}
function slotLeft(l){var v=S.play.slots[l];return v==null?slotMax(l):v}
function slotLevels(){return Object.keys((S.char.spells&&S.char.spells.slots)||{}).map(Number).sort(function(a,b){return a-b})}
function resetSlots(){var sl=(S.char.spells&&S.char.spells.slots)||{};S.play.slots={};Object.keys(sl).forEach(function(l){S.play.slots[l]=sl[l]})}
function slotRows(){
  var lv=slotLevels();if(!lv.length)return '';
  var h='<div class="card slots"><span class="muted">Spell slots</span>';
  lv.forEach(function(l){
    var mx=slotMax(l),cur=slotLeft(l),pips='';
    for(var i=0;i<mx;i++)pips+='<button class="spip'+(i<cur?' on':'')+'" data-a="slot" data-l="'+l+'" data-i="'+i+'" aria-label="Level '+l+' slot '+(i+1)+(i<cur?', available':', used')+'"></button>';
    h+='<div class="srow"><span class="sl">'+ordinal(l)+'</span><span class="pips">'+pips+'</span><span class="muted">'+cur+'/'+mx+'</span></div>';
  });
  return h+'</div>';
}
function concHtml(){
  var p=S.play,h='';
  if(p.conc)h+='<div class="conc"><span><b>Concentrating</b> on '+esc(p.conc.name)+'</span><button class="btn" data-a="conc-end">End</button></div>';
  if(p.concCheck)h+='<div class="conc check"><span><b>Concentration check</b><br>Constitution save, DC '+p.concCheck.dc+'</span><div class="cbtns"><button class="btn pri" data-a="conc-roll">Roll</button><button class="btn" data-a="conc-keep">Held</button><button class="btn dmg" data-a="conc-lose">Lost</button></div></div>';
  Object.keys(p.effects||{}).forEach(function(id){if(p.effects[id]&&M.effects[id])h+='<div class="conc fx"><span><b>'+esc(M.effects[id].name)+'</b> is active</span><button class="btn" data-a="fx-end" data-id="'+id+'">End</button></div>'});

}
function fontCard(){
  if(!M.spId)return '';
  var sp=left(M.spId),mx=trk(M.spId).max;
  var h='<div class="card" style="margin-top:12px"><h2 class="sec">Font of Magic</h2><p class="muted">Sorcery Points: '+sp+' of '+mx+'</p><div class="fbtns">';
  slotLevels().forEach(function(l){h+='<button class="btn" data-a="font-conv" data-l="'+l+'"'+((slotLeft(l)<=0||sp>=mx)?' disabled':'')+'>Level '+l+' slot to +'+l+' SP</button>'});
  Object.keys(M.spCost).map(Number).sort(function(a,b){return a-b}).forEach(function(l){
    if(!slotMax(l))return;
    var c=M.spCost[l];
    h+='<button class="btn" data-a="font-make" data-l="'+l+'"'+((sp<c||slotLeft(l)>=slotMax(l))?' disabled':'')+'>Make a level '+l+' slot (\u2212'+c+' SP)</button>';
  });
  return h+'</div></div>';
}
function spellMeta(s){
  var m=[timeLabel(s.time),s.range];
  var sv=s.saveHit.match(/\b(STR|DEX|CON|INT|WIS|CHA)\s+\d+/i);if(sv)m.push(sv[0].toUpperCase());
  var at=s.saveHit.match(/\+\d+/);if(at)m.push('attack '+at[0]);

function spellFilterHtml(){return spellModeHtml()+spellFilterHtml0()}

function spellRowHtml(s){

   +'<button class="spbtn" data-a="spell" data-id="'+esc(s.id)+'"><span class="sn">'+esc(s.name)+(s.conc?' <i class="tg">C</i>':'')+(s.ritual?' <i class="tg">R</i>':'')+'</span><small>'+esc(spellMeta(s))+'</small></button></div>';

function renderSpellList(){

function spellDef(s){return SPELL_DMG[String(s.name).toLowerCase()]||null}

function loadScript(src){
  return new Promise(function(res,rej){
    var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error('Could not load the PDF reader. Check your connection and try again.'))};
    document.head.appendChild(s);

}
function loadPdfJs(){
  if(window.pdfjsLib&&window.pdfjsWorker)return Promise.resolve();
  return loadScript(PDFJS).then(function(){return loadScript(PDFJS_WORKER)}).then(function(){
    window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;
  });
}
function importFile(file){
  var msg=function(t){Array.prototype.forEach.call(document.querySelectorAll('.impMsg'),function(el){el.textContent=t})};
  msg('Reading the PDF\u2026');
  loadPdfJs().then(function(){return file.arrayBuffer()}).then(function(buf){
    return window.pdfjsLib.getDocument({data:new Uint8Array(buf),isEvalSupported:false,useWorkerFetch:false,disableFontFace:true}).promise;
  }).then(function(doc){
    var raw={},order=[],chain=Promise.resolve();
    for(var p=1;p<=doc.numPages;p++){(function(n){
      chain=chain.then(function(){return doc.getPage(n)}).then(function(pg){return pg.getAnnotations()}).then(function(an){
        an.forEach(function(a){
          if(a.subtype==='Widget'&&a.fieldName){
            var v=a.fieldValue;if(Array.isArray(v))v=v.join('\n');
            order.push(a.fieldName);
            if(!(a.fieldName in raw)||(!raw[a.fieldName]&&v))raw[a.fieldName]=v==null?'':v;
          }
        });
      });
    })(p)}
    return chain.then(function(){raw.__order=order;return raw});
  }).then(function(raw){
    var ch=parseDBFields(raw);
    if(!ch.attacks.length&&!ch.features.length)throw new Error('I couldn\u2019t find any attacks or features in that PDF. Is it the D&D Beyond character sheet export?');
    applyImport(ch);
  }).catch(function(err){
    msg(err&&err.message?err.message:'Something went wrong reading that PDF.');
  });
}
function applyImport(ch){
  var id=dbSlug(ch.name)||'character',ex=DB.chars[id],newM=buildModel(ch);
  var line=(ch.cls?ch.cls+' '+ch.level:'Level '+ch.level)+(ch.sub?' \u00b7 '+ch.sub:'');

  if(!ex){
    DB.chars[id]={char:ch,play:freshPlay(ch,newM),imported:stamp};
    setActive(id);save();
    SUM={name:ch.name,isNew:true,line:line,changes:[]};
    openSheet('summary');return;
  }
  var old=ex.char,oldM=buildModel(old),ch2=[];
  if(old.level!==ch.level)ch2.push('Level '+old.level+' to '+ch.level+(ch.cls?' ('+ch.cls+')':''));
  if(old.hpMax!==ch.hpMax)ch2.push('Max HP '+old.hpMax+' to '+ch.hpMax);
  if(old.ac!==ch.ac)ch2.push('Armour class '+old.ac+' to '+ch.ac);
  if(old.profBonus!==ch.profBonus)ch2.push('Proficiency bonus '+sgn(old.profBonus)+' to '+sgn(ch.profBonus));
  DB_ABIL.forEach(function(k){if(old.abilities[k].score!==ch.abilities[k].score)ch2.push(k.toUpperCase()+' '+old.abilities[k].score+' to '+ch.abilities[k].score)});
  var on=old.features.map(function(f){return f.name.toLowerCase()});
  var nn=ch.features.map(function(f){return f.name.toLowerCase()});
  function opts(c){var r=[];c.features.forEach(function(f){f.options.forEach(function(o){r.push(o.name.toLowerCase())})});return r}
  var oo=opts(old);
  ch.features.forEach(function(f){if(on.indexOf(f.name.toLowerCase())<0)ch2.push('New feature: '+f.name)});
  ch.features.forEach(function(f){f.options.forEach(function(o){if(oo.indexOf(o.name.toLowerCase())<0&&on.indexOf(f.name.toLowerCase())>-1)ch2.push('New option: '+o.name)})});
  old.features.forEach(function(f){if(nn.indexOf(f.name.toLowerCase())<0)ch2.push('Removed: '+f.name)});
  var oa=old.attacks.map(function(a){return a.name}),na=ch.attacks.map(function(a){return a.name});
  na.forEach(function(n){if(oa.indexOf(n)<0)ch2.push('New attack: '+n)});
  oa.forEach(function(n){if(na.indexOf(n)<0)ch2.push('Attack removed: '+n)});
  var osp=((old.spells&&old.spells.list)||[]).map(function(x){return x.name.toLowerCase()}),nsp=((ch.spells&&ch.spells.list)||[]).filter(function(x){return osp.indexOf(x.name.toLowerCase())<0}).map(function(x){return x.name});
  if(osp.length&&nsp.length)ch2.push('New spells: '+nsp.slice(0,8).join(', ')+(nsp.length>8?' and '+(nsp.length-8)+' more':''));
  var oslots=JSON.stringify((old.spells&&old.spells.slots)||{}),nslots=JSON.stringify((ch.spells&&ch.spells.slots)||{});
  if(oslots!==nslots&&osp.length)ch2.push('Spell slots changed');
  var p=ex.play;p.once=p.once||{};
  if(ch.hpMax>old.hpMax)p.hp=p.hp+(ch.hpMax-old.hpMax);
  p.hp=Math.max(0,Math.min(p.hp,ch.hpMax));
  var t={};
  newM.trackers.forEach(function(x){
    var prev=oldM.trackers.filter(function(y){return y.id===x.id})[0];
    if(prev){var cur=p.trk[x.id];if(cur==null)cur=x.max;if(x.max>prev.max)cur+=x.max-prev.max;t[x.id]=Math.min(cur,x.max)}
    else t[x.id]=x.max;
  });
  p.trk=t;
  var os0=(old.spells&&old.spells.slots)||{},ns0=(ch.spells&&ch.spells.slots)||{},nsl={};
  p.slots=p.slots||{};
  Object.keys(ns0).forEach(function(l){var cur=p.slots[l];if(cur==null)cur=ns0[l];else if(os0[l]!=null&&ns0[l]>os0[l])cur+=ns0[l]-os0[l];nsl[l]=Math.min(cur,ns0[l])});
  p.slots=nsl;
  ex.char=ch;ex.imported=stamp;reconcileInv(ex);
  setActive(id);save();
  SUM={name:ch.name,isNew:false,line:line,changes:ch2};
  openSheet('summary');
}

function finishDice(expr,rolls,mod,note,extra){
  var base=extra&&extra.used!=null?extra.used:sum(rolls),total=base+mod;
  var e=expr+(mod?' '+(mod<0?'\u2212':'+')+' '+Math.abs(mod):'');
  var detail=note||(rolls.length>1?rolls.join(' + ')+' = '+sum(rolls):rolls.join(''));
  var res={expr:e,detail:detail,total:total,rolls:rolls,nat20:!!(extra&&extra.nat20),nat1:!!(extra&&extra.nat1)};
  DR.last=res;DR.hist.unshift(res);if(DR.hist.length>10)DR.hist.pop();
  if(S&&!PICK)logAdd('check',{name:'Dice roll '+e,total:total,detail:detail});
  renderSheet();
}
function diceRoll(x){
  var s=drs(),n=s.n,mod=s.mod;
  if(x===20&&n===1&&ADV!==0){
    askD20('Roll a d20',function(r){
      finishDice('d20',[r.a,r.b],mod,'rolled '+r.a+' and '+r.b+', kept '+r.used,{used:r.used,nat20:r.used===20,nat1:r.used===1});
    });
    return;
  }
  ask('Roll '+n+'d'+x,[{label:n+'d'+x,n:n,x:x}],function(arr){
    var r=arr[0];
    finishDice(n+'d'+x,r,mod,null,(n===1&&x===20)?{nat20:r[0]===20,nat1:r[0]===1}:null);
  });
}

/* ---------- back up and restore ---------- */
var RS=null;
function bkMsg(t){Array.prototype.forEach.call(document.querySelectorAll('.bkMsg'),function(el){el.textContent=t})}
function backupText(){return JSON.stringify({app:'combat-hud',format:1,version:APP_VERSION,exported:new Date().toISOString(),db:DB})}
function backupName(){var d=new Date(),z=function(n){return ('0'+n).slice(-2)};return 'combat-hud-backup-'+d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'.json'}
function downloadBackup(text,name){
  try{
    var blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url)},4000);
    bkMsg('Saved '+name+' ('+Math.max(1,Math.round(text.length/1024))+' KB). Keep it somewhere safe.');
  }catch(e){bkMsg('Could not save a file here. Try Copy backup text instead.')}
}
function saveBackup(){
  var text=backupText(),name=backupName(),file=null;
  try{file=new File([text],name,{type:'application/json'})}catch(e){}
  if(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'Combat HUD backup'}).then(function(){bkMsg('Backup shared.')}).catch(function(err){if(err&&err.name==='AbortError')return;downloadBackup(text,name)});
    return;
  }
  downloadBackup(text,name);
}
function copyBackup(){
  var text=backupText();
  var done=function(){bkMsg('Backup copied. Paste it into a note or a message to yourself.')};
  var fail=function(){
    var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    var ok=false;try{ok=document.execCommand('copy')}catch(e){}
    document.body.removeChild(ta);
    if(ok)done();else bkMsg('Could not copy here. Use Save a backup file instead.');
  };
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,fail);else fail();
}
function parseBackup(text){
  var o;try{o=JSON.parse(text)}catch(e){return {err:'That does not look like a Combat HUD backup. It is not readable.'}}
  var db=o&&o.db&&o.db.chars?o.db:(o&&o.chars?o:null);
  if(!db)return {err:'That file does not contain any Combat HUD characters.'};
  var ids=Object.keys(db.chars).filter(function(id){var c=db.chars[id];return c&&c.char&&c.char.name&&c.play});
  if(!ids.length)return {err:'The backup has no usable characters in it.'};
  var chars={};ids.forEach(function(id){chars[id]=db.chars[id]});
  return {db:{chars:chars,active:chars[db.active]?db.active:ids[0],mode:db.mode,dice:db.dice,dr:db.dr},ids:ids,exported:o.exported||'',version:o.version||''};
}
function startRestore(text){
  var r=parseBackup(String(text||'').trim());
  if(r.err){bkMsg(r.err);return}
  RS=r;DELARM='';openSheet('restore');
}
function restoreSheet(){
  var names=RS.ids.map(function(id){return esc(RS.db.chars[id].char.name)}).join(', ');
  var have=Object.keys(DB.chars).length,newOnes=RS.ids.filter(function(id){return !DB.chars[id]});
  var when='an unknown date';try{if(RS.exported)when=new Date(RS.exported).toLocaleString('en-GB')}catch(e){}
  var h='<h2>Restore a backup</h2><p class="muted">Saved '+esc(when)+(RS.version?' by version '+esc(RS.version):'')+'.</p>';
  h+='<p><b>'+RS.ids.length+' character'+(RS.ids.length===1?'':'s')+' in the backup:</b> '+names+'.</p>';
  h+='<div class="note">This device has '+have+' character'+(have===1?'':'s')+' right now.</div>';
  h+='<button class="btn pri big" data-a="rs-merge" style="margin-top:12px"'+(newOnes.length?'':' disabled')+'>Add the '+newOnes.length+' character'+(newOnes.length===1?'':'s')+' I do not have yet</button>';
  h+='<button class="btn'+(DELARM==='rs'?' dmg':'')+' big" data-a="rs-replace" style="margin-top:8px">'+(DELARM==='rs'?'Tap again to replace everything':'Replace everything on this device')+'</button>';
  h+='<button class="btn big" data-a="close" style="margin-top:8px">Cancel</button>';
  return h;
}
function readBackupFile(file){
  var go=function(t){startRestore(t)};
  if(file.text)file.text().then(go,function(){bkMsg('Could not read that file.')});
  else{var fr=new FileReader();fr.onload=function(){go(fr.result)};fr.onerror=function(){bkMsg('Could not read that file.')};fr.readAsText(file)}
}

var IT=null,IA=null;
function ikey(n){return String(n).trim().toLowerCase()}
function invOf(){var p=S.play;p.inv=p.inv||{};p.inv.adj=p.inv.adj||{};p.inv.base=p.inv.base||{};p.inv.add=p.inv.add||{};return p.inv}
function attunedKeys(){var o={};mergeItems(S.char.gear.attuned).forEach(function(x){o[ikey(x.name)]=1});return o}
function pdfEquipment(){var att=attunedKeys();return mergeItems(S.char.gear.items.filter(function(x){return !att[ikey(x.name)]}))}
function invList(){
  var inv=invOf(),out=[],used=[],seen={};
  pdfEquipment().forEach(function(x){
    var k=ikey(x.name);seen[k]=1;
    if(inv.base[k]==null)inv.base[k]=x.qty;
    var q=Math.max(0,x.qty+(inv.adj[k]||0)),unit=x.qty>0?x.w/x.qty:0;
    var it={key:k,name:x.name,qty:q,unit:unit,w:unit*q,pdf:true};
    (q>0?out:used).push(it);
  });
  Object.keys(inv.add).forEach(function(k){
    var a=inv.add[k];if(seen[k]||!(a.qty>0))return;
    out.push({key:k,name:a.name,qty:a.qty,unit:a.unit||0,w:(a.unit||0)*a.qty,pdf:false});
  });
  return {items:out,used:used};
}
function invDelta(){
  var inv=invOf(),d=0,seen={};
  pdfEquipment().forEach(function(x){
    var k=ikey(x.name);seen[k]=1;var adj=inv.adj[k]||0;
    if(adj&&x.qty>0)d+=(x.w/x.qty)*Math.max(adj,-x.qty);
  });
  Object.keys(inv.add).forEach(function(k){var a=inv.add[k];if(!seen[k])d+=(a.unit||0)*(a.qty||0)});
  return d;
}
function itemFind(key){var L=invList(),r=null;L.items.concat(L.used).forEach(function(x){if(x.key===key)r=x});return r}
function changeQty(it,delta){

  else if(inv.add[it.key]){inv.add[it.key].qty+=delta;if(inv.add[it.key].qty<=0)delete inv.add[it.key]}
  save();
}
function reconcileInv(entry){
  var p=entry.play,g=entry.char.gear;p.inv=p.inv||{};var inv=p.inv;inv.adj=inv.adj||{};inv.base=inv.base||{};inv.add=inv.add||{};
  var att={};mergeItems(g.attuned).forEach(function(x){att[ikey(x.name)]=1});
  var now={};mergeItems(g.items.filter(function(x){return !att[ikey(x.name)]})).forEach(function(x){now[ikey(x.name)]=x.qty});
  Object.keys(inv.adj).forEach(function(k){
    if(now[k]==null){delete inv.adj[k]}
    else if(inv.base[k]!=null&&inv.base[k]!==now[k]){inv.adj[k]=0}
  });
  inv.base=now;

}
var ITEM_HEAL=[[/^potion of supreme healing/i,'10d4+20'],[/^potion of superior healing/i,'8d4+8'],[/^potion of greater healing/i,'4d4+4'],[/^potion of healing/i,'2d4+2']];

  if(/^alchemist.?s fire/i.test(n))return {kind:'dmg',dice:'1d4',type:'fire',verb:'Throw',note:'Make a ranged attack roll against the target first. On a hit it takes the damage below, and again at the start of each of its turns until the flames are put out.'};

var PREP_FROM_LIST=['artificer','cleric','druid','paladin','wizard'];
function needsPrep(s){
  if(s.level===0||s.always)return false;
  var src=(s.srcs&&s.srcs.length?s.srcs:[s.source]).map(function(x){return String(x||'').toLowerCase().replace(/\s*\(.*\)\s*/,'').trim()}).filter(Boolean);
  return src.length>0&&src.every(function(x){return PREP_FROM_LIST.indexOf(x)>-1});
}
function hasPrepSpells(){return spellsOf().some(needsPrep)}
function isMine(s){return !needsPrep(s)||!!S.play.fav[s.id]}
function spellMode(){return hasPrepSpells()?(S.play.sm||'mine'):'all'}
function prepCount(){return spellsOf().filter(function(s){return needsPrep(s)&&S.play.fav[s.id]}).length}
/* ---------- spell descriptions (SRD 5.2.1) ---------- */
function nk(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function spellText(s){var k=nk(s.name);return SPELL_TEXT.spells[k]||SPELL_TEXT.spells[SPELL_TEXT.alias[k]]||null}
function mdInline(t){
  return esc(t)
    .replace(/\*\*\*([^*]+)\*\*\*/g,'<b><i>$1</i></b>')
    .replace(/\*\*_([^_*]+)_\*\*/g,'<b><i>$1</i></b>')
    .replace(/_\*\*([^*]+)\*\*_/g,'<b><i>$1</i></b>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/\*([^*]+)\*/g,'<i>$1</i>')
    .replace(/(^|[^A-Za-z0-9_])_([^_]+)_(?![A-Za-z0-9_])/g,'$1<i>$2</i>');
}
function mdBlocks(md){
  return String(md||'').replace(/^#+\s*/gm,'').split(/\n{2,}/).map(function(blk){
    var lines=blk.split('\n').filter(function(l){return l.trim()!==''});
    if(!lines.length)return '';
    if(/^\s*\|/.test(lines[0])){
      var rows=lines.filter(function(l){return !/^\s*\|[\s:|-]+\|\s*$/.test(l)}).map(function(l){return l.trim().replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim()})});
      return '<div class="tblwrap"><table class="spt">'+rows.map(function(r,i){var tg=i?'td':'th';return '<tr>'+r.map(function(c){return '<'+tg+'>'+mdInline(c)+'</'+tg+'>'}).join('')+'</tr>'}).join('')+'</table></div>';
    }
    if(/^\s*[-*] /.test(lines[0]))return '<ul class="fopts">'+lines.map(function(l){return '<li>'+mdInline(l.replace(/^\s*[-*] /,''))+'</li>'}).join('')+'</ul>';
    return '<p>'+lines.map(mdInline).join(' ')+'</p>';
  }).join('');
}

/* ---------- undo from the log ---------- */
var ACT=null,GSEQ=0,SEP='\u001f';
var NUMROOT={hp:1,temp:1,trk:1,slots:1,free:1,hd:1,death:1,inv:1};
function flatInto(o,pre,out){
  if(o==null||typeof o!=='object')return;
  Object.keys(o).forEach(function(k){
    var v=o[k],pth=pre+SEP+k;
    if(v!==null&&typeof v==='object')flatInto(v,pth,out);
    else if(v!==undefined&&v!==null)out[pth]=v;
  });
}
function resFlat(){
  var p=S.play,o={hp:p.hp,temp:p.temp,insp:!!p.insp};
  ['trk','slots','free','once','hd','effects','death'].forEach(function(k){flatInto(p[k],k,o)});
  flatInto(p.conc,'conc',o);
  if(p.inv){flatInto(p.inv.adj,'inv'+SEP+'adj',o);flatInto(p.inv.add,'inv'+SEP+'add',o)}
  return o;
}
function actStart(){
  if(!S){ACT=null;return}
  ACT={s:S,base:resFlat(),last:null,g:Date.now().toString(36)+'.'+(++GSEQ)};
  setTimeout(function(){ACT=null},0);
}
function diffFlat(a,b){
  var out=[],keys={};
  Object.keys(a).forEach(function(k){keys[k]=1});Object.keys(b).forEach(function(k){keys[k]=1});
  Object.keys(keys).forEach(function(k){
    var x=a[k],y=b[k];if(x===y)return;
    var q=k.split(SEP),numeric=NUMROOT[q[0]]&&!(q[0]==='inv'&&q[q.length-1]==='name');
    if(numeric&&(typeof x==='number'||x===undefined)&&(typeof y==='number'||y===undefined)){
      var dd=(y||0)-(x||0);if(dd!==0)out.push({k:k,d:dd});
    }else out.push({k:k,b:x===undefined?null:x,a:y===undefined?null:y});
  });
  return out;
}
function mergeRecs(list,incs){
  var out=list.slice();
  incs.forEach(function(r){
    var i=-1;for(var j=0;j<out.length;j++)if(out[j].k===r.k){i=j;break}
    if(i<0){out.push(r);return}
    var o=out[i];
    if(typeof o.d==='number'&&typeof r.d==='number'){o.d+=r.d;if(o.d===0)out.splice(i,1)}
    else if(o.d===undefined&&r.d===undefined){o.a=r.a;if(JSON.stringify(o.b)===JSON.stringify(o.a))out.splice(i,1)}
    else out[i]=r;
  });
  return out;
}
function claimLog(e,isNew){
  if(!ACT||!S||ACT.s!==S)return;
  var now=resFlat(),inc=diffFlat(ACT.base,now);ACT.base=now;
  if(isNew&&!e.g)e.g=ACT.g;
  ACT.last=e;
  if(inc.length)e.u=mergeRecs(e.u||[],inc);
}
function claimTail(){
  if(!ACT||!S||ACT.s!==S||!ACT.last||ACT.last.undone)return;
  var now=resFlat(),inc=diffFlat(ACT.base,now);ACT.base=now;
  if(inc.length){ACT.last.u=mergeRecs(ACT.last.u||[],inc);save()}
}
function pget(p,k){var parts=k.split(SEP),o=p;for(var i=0;i<parts.length;i++){if(o==null)return undefined;o=o[parts[i]]}return o}
function pset(p,k,v){
  var parts=k.split(SEP),o=p;
  for(var i=0;i<parts.length-1;i++){if(o[parts[i]]==null||typeof o[parts[i]]!=='object')o[parts[i]]={};o=o[parts[i]]}
  var last=parts[parts.length-1];
  if(v===undefined)delete o[last];else o[last]=v;
}
function boundFor(k,v){
  var q=k.split(SEP),root=q[0],key=q[1];
  if(root==='hp')return Math.max(0,Math.min(S.char.hpMax,v));
  if(root==='temp'||root==='free')return Math.max(0,v);
  if(root==='trk'){var t=trk(key);return Math.max(0,t?Math.min(t.max,v):v)}
  if(root==='slots')return Math.max(0,Math.min(slotMax(+key),v));
  if(root==='hd'){var hi=hdInit(S.char)[key];return Math.max(0,hi==null?v:Math.min(hi,v))}
  if(root==='death')return Math.max(0,Math.min(3,v));
  if(root==='inv'&&q[1]==='add'&&q[3]==='qty')return Math.max(0,v);
  return v;
}
function refundText(recs){
  var parts=[];
  recs.forEach(function(r){
    var q=r.k.split(SEP),root=q[0],key=q[1];
    if(typeof r.d==='number'){
      var n=-r.d,sg=n>0?'+':'\u2212',ab=Math.abs(n);
      if(root==='hp')parts.push(sg+ab+' HP');
      else if(root==='temp')parts.push(sg+ab+' temporary HP');
      else if(root==='trk'){var t=trk(key);parts.push(sg+ab+' '+(t?t.name:key))}
      else if(root==='slots')parts.push(sg+ab+' level '+key+' slot'+(ab>1?'s':''));
      else if(root==='free')parts.push('a free cast');
      else if(root==='hd')parts.push(sg+ab+' hit die ('+key+')');
      else if(root==='inv'&&q[1]==='adj')parts.push(sg+ab+' '+key);
      else if(root==='inv'&&q[1]==='add'&&q[3]==='qty')parts.push(sg+ab+' '+q[2]);
    }else{
      if(root==='once')parts.push('a once-per-turn use');
      else if(root==='conc'&&q[1]==='name')parts.push('concentration');
      else if(root==='effects')parts.push('an effect');
    }
  });
  return parts.filter(function(x,i){return parts.indexOf(x)===i}).join(', ');
}
function groupOf(ent){
  var L=LG(),g=ent.g?L.entries.filter(function(x){return x.g===ent.g&&!x.undone}):[ent];
  if(g.indexOf(ent)<0)g.push(ent);
  return g.sort(function(a,b){return b.id-a.id});
}
function groupRecs(ent){var r=[];groupOf(ent).forEach(function(x){(x.u||[]).forEach(function(y){r.push(y)})});return r}
function undoEntry(ent){
  var L=LG(),p=S.play,grp=groupOf(ent),recs=groupRecs(ent),skipped=0;
  if(!recs.length){
    grp.forEach(function(x){var i=L.entries.indexOf(x);if(i>-1)L.entries.splice(i,1)});
    save();return 'Removed from the log.';
  }
  grp.forEach(function(x){
    (x.u||[]).forEach(function(r){
      if(typeof r.d==='number'){
        var cur=pget(p,r.k);if(cur===undefined)cur=0;
        pset(p,r.k,boundFor(r.k,cur-r.d));
      }else{
        var want=r.a===null?undefined:r.a;
        if(JSON.stringify(pget(p,r.k))===JSON.stringify(want))pset(p,r.k,r.b===null?undefined:r.b);
        else skipped++;
      }
    });
    x.undone=true;
  });
  if(p.conc&&!p.conc.name)p.conc=null;
  if(p.inv)Object.keys(p.inv.add||{}).forEach(function(k){var a=p.inv.add[k];if(!a||!(a.qty>0))delete p.inv.add[k]});
  if(grp.some(function(x){return x.type==='hp'&&x.kind==='damage'}))p.concCheck=null;
  save();
  var rt=refundText(recs);
  return 'Undone.'+(rt?' Put back: '+rt+'.':'')+(skipped?' Some things had changed since, so those were left as they are.':'');
}

function applyHp(dmg,amt,src){
  var p=S.play,was=p.hp;
  if(dmg){
    var a=Math.min(p.temp,amt);p.temp-=a;amt-=a;p.hp=Math.max(0,p.hp-amt);
    logAdd('hp',{kind:'damage',amount:amt+a,temp:a,hp:p.hp,max:S.char.hpMax});
    var tot=amt+a;
    if(tot>0&&p.conc){
      if(p.hp<=0){logAdd('note',{text:'Dropped to 0 HP. Concentration on '+p.conc.name+' ends.'});p.conc=null;p.concCheck=null}
      else p.concCheck={dc:Math.max(10,Math.floor(tot/2))};
    }
  }else{
    p.hp=Math.min(S.char.hpMax,p.hp+amt);if(was<=0&&p.hp>0)p.death={s:0,f:0};
    if(p.hp-was>0)logAdd('hp',{kind:'heal',amount:p.hp-was,src:src||'',hp:p.hp,max:S.char.hpMax});
  }
}
